name: Reset Firebase Passwords

on:
  workflow_dispatch:
    inputs:
      architecte_pwd:
        description: 'Nouveau mot de passe Architecte'
        required: true
      vm_pwd:
        description: 'Nouveau mot de passe VM'
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Reset passwords via Firebase Admin
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ARCHITECTE_PWD: ${{ inputs.architecte_pwd }}
          VM_PWD: ${{ inputs.vm_pwd }}
        run: |
          npm install firebase-admin --silent
          NODE_PATH=$(pwd)/node_modules node - <<'EOF'
          const { initializeApp, cert } = require('firebase-admin/app');
          const { getAuth } = require('firebase-admin/auth');

          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          initializeApp({ credential: cert(sa) });
          const auth = getAuth();

          (async () => {
            const accounts = [
              { email: 'architecte@cg51-virtuel.fr', pwd: process.env.ARCHITECTE_PWD },
              { email: 'vm@cg51-virtuel.fr',         pwd: process.env.VM_PWD },
            ];

            for (const { email, pwd } of accounts) {
              if (!pwd) { console.log(`Skipping ${email} — mot de passe vide`); continue; }
              try {
                const user = await auth.getUserByEmail(email);
                await auth.updateUser(user.uid, { password: pwd });
                console.log(`✅ Mot de passe mis à jour : ${email}`);
              } catch (e) {
                console.warn(`⚠️  ${email} : ${e.message}`);
              }
            }
            process.exit(0);
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
