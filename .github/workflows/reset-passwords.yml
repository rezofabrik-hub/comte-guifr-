name: Reset Firebase Passwords

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulation seulement (true = ne fait rien, false = envoie les emails)'
        required: false
        default: 'true'

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Send password reset emails to all members
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          npm install firebase-admin node-fetch --silent
          NODE_PATH=$(pwd)/node_modules node - <<'EOF'
          const { initializeApp, cert } = require('firebase-admin/app');
          const { getAuth } = require('firebase-admin/auth');
          const { getFirestore } = require('firebase-admin/firestore');
          const fetch = (...args) => import('node-fetch').then(m => m.default(...args));

          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          const projectId = sa.project_id;
          const apiKey = process.env.FIREBASE_API_KEY;
          initializeApp({ credential: cert(sa) });
          const auth = getAuth();
          const db = getFirestore();
          const dryRun = process.env.DRY_RUN !== 'false';

          async function sendResetEmail(email) {
            const res = await fetch(
              `https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=${apiKey}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ requestType: 'PASSWORD_RESET', email }),
              }
            );
            if (!res.ok) {
              const err = await res.json();
              throw new Error(err.error?.message || res.statusText);
            }
          }

          (async () => {
            console.log(`Mode: ${dryRun ? 'DRY RUN (simulation)' : 'RÉEL — envoi des emails de reset'}`);
            if (!apiKey && !dryRun) {
              console.error('❌ FIREBASE_API_KEY manquant — ajoutez-le en secret GitHub.');
              process.exit(1);
            }

            const emails = new Set();

            // Enumerate all Firebase Auth users
            let pageToken;
            do {
              const result = await auth.listUsers(1000, pageToken);
              for (const u of result.users) {
                if (u.email) emails.add(u.email.trim().toLowerCase());
              }
              pageToken = result.pageToken;
            } while (pageToken);

            console.log(`\nComptes Firebase Auth trouvés : ${emails.size}`);
            let sent = 0, errors = 0;

            for (const email of emails) {
              try {
                if (dryRun) {
                  console.log(`[DRY RUN] Email de reset serait envoyé à : ${email}`);
                } else {
                  await sendResetEmail(email);
                  console.log(`✅ Email de reset envoyé : ${email}`);
                  sent++;
                  // Avoid rate limiting
                  await new Promise(r => setTimeout(r, 200));
                }
              } catch (e) {
                console.error(`❌ Erreur pour ${email} : ${e.message}`);
                errors++;
              }
            }

            console.log(`\nRésumé : ${sent} emails envoyés, ${errors} erreurs`);
            if (dryRun) console.log('⚠️  Relancez avec dry_run=false pour envoyer les vrais emails.');
            process.exit(errors > 0 ? 1 : 0);
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
