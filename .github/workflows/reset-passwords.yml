name: Reset Firebase Passwords

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulation seulement (true = ne fait rien, false = envoie les emails)'
        required: false
        default: 'true'

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Send password reset links to all members
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          npm install firebase-admin --silent
          NODE_PATH=$(pwd)/node_modules node - <<'EOF'
          const { initializeApp, cert } = require('firebase-admin/app');
          const { getAuth } = require('firebase-admin/auth');
          const { getFirestore } = require('firebase-admin/firestore');

          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          initializeApp({ credential: cert(sa) });
          const auth = getAuth();
          const db = getFirestore();
          const dryRun = process.env.DRY_RUN !== 'false';

          (async () => {
            console.log(`Mode: ${dryRun ? 'DRY RUN (simulation)' : 'RÉEL — envoi des liens'}`);

            // Collect all unique emails from members collection across all loges
            const emails = new Set();

            const loges = await db.collection('loges').get();
            for (const loge of loges.docs) {
              const members = await db.collection('loges').doc(loge.id).collection('members').get();
              for (const m of members.docs) {
                const data = m.data();
                if (data.email) emails.add(data.email.trim().toLowerCase());
              }
            }

            // Also enumerate directly via Firebase Auth list
            let pageToken;
            do {
              const result = await auth.listUsers(1000, pageToken);
              for (const u of result.users) {
                if (u.email) emails.add(u.email.trim().toLowerCase());
              }
              pageToken = result.pageToken;
            } while (pageToken);

            console.log(`\nComptes trouvés : ${emails.size}`);
            let sent = 0, skipped = 0, errors = 0;

            for (const email of emails) {
              try {
                if (dryRun) {
                  console.log(`[DRY RUN] Lien de reset serait envoyé à : ${email}`);
                  skipped++;
                } else {
                  const link = await auth.generatePasswordResetLink(email);
                  console.log(`✅ Lien de reset généré : ${email}`);
                  // Note: generatePasswordResetLink génère le lien mais n'envoie pas l'email.
                  // Firebase envoie automatiquement l'email si sendPasswordResetEmail est appelé côté client,
                  // ou via l'API REST Firebase Auth.
                  // Ici on log le lien pour usage manuel si besoin.
                  console.log(`   → ${link}`);
                  sent++;
                }
              } catch (e) {
                if (e.code === 'auth/user-not-found') {
                  console.log(`⚠️  Utilisateur non trouvé dans Auth : ${email}`);
                } else {
                  console.error(`❌ Erreur pour ${email} : ${e.message}`);
                  errors++;
                }
              }
            }

            console.log(`\nRésumé : ${sent} liens générés, ${skipped} ignorés (dry run), ${errors} erreurs`);
            if (dryRun) {
              console.log('\n⚠️  Relancez avec dry_run=false pour générer les vrais liens.');
            }
            process.exit(errors > 0 ? 1 : 0);
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
