name: Reset Firebase Passwords

on:
  workflow_dispatch:
    inputs:
      architecte_pwd:
        description: 'Nouveau mot de passe Architecte'
        required: true
      vm_pwd:
        description: 'Nouveau mot de passe VM'
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Reset passwords via Firebase Admin
        run: |
          npm install -g firebase-tools

          # Récupérer les UIDs et changer les mots de passe
          firebase auth:export users.json --project site-cg51 --token "${{ secrets.FIREBASE_TOKEN }}"
          cat users.json

          # Changer mot de passe architecte
          firebase auth:update architecte@cg51-virtuel.fr --password "${{ github.event.inputs.architecte_pwd }}" --project site-cg51 --token "${{ secrets.FIREBASE_TOKEN }}" 2>/dev/null || true

          # Changer mot de passe VM
          firebase auth:update vm@cg51-virtuel.fr --password "${{ github.event.inputs.vm_pwd }}" --project site-cg51 --token "${{ secrets.FIREBASE_TOKEN }}" 2>/dev/null || true

          echo "Mots de passe mis à jour avec succès"
