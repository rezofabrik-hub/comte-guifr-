name: Update Firebase Passwords

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-firebase-passwords.yml'
  workflow_dispatch:

jobs:
  update-passwords:
    runs-on: ubuntu-latest
    steps:
      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Update all grade account passwords
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          node << 'EOF'
          const https = require('https');
          const { execSync } = require('child_process');

          // Extract OAuth credentials from installed firebase-tools
          let clientId, clientSecret;
          try {
            const pkg = require('/usr/local/lib/node_modules/firebase-tools/lib/auth.js');
            // Try to find credentials in the module
            const src = require('fs').readFileSync(
              '/usr/local/lib/node_modules/firebase-tools/lib/auth.js', 'utf8'
            );
            const cidMatch = src.match(/client_id['":\s]+['"]([^'"]+\.apps\.googleusercontent\.com)['"]/);
            const csMatch  = src.match(/client_secret['":\s]+['"]([^'"]{20,})['"]/);
            if (cidMatch) clientId = cidMatch[1];
            if (csMatch)  clientSecret = csMatch[1];
          } catch(e) {}

          // Fallback: search across common paths in the package
          if (!clientId || !clientSecret) {
            const { execSync } = require('child_process');
            try {
              const grep = execSync(
                "grep -r 'client_secret' /usr/local/lib/node_modules/firebase-tools/lib/ --include='*.js' -l",
                { encoding: 'utf8' }
              ).trim().split('\n');
              for (const f of grep) {
                const src = require('fs').readFileSync(f, 'utf8');
                const cidM = src.match(/['"]client_id['"]\s*:\s*['"]([^'"]+\.apps\.googleusercontent\.com)['"]/);
                const csM  = src.match(/['"]client_secret['"]\s*:\s*['"]([A-Za-z0-9_\-]{20,})['"]/);
                if (cidM && csM) { clientId = cidM[1]; clientSecret = csM[1]; break; }
              }
            } catch(e) { console.error('grep failed:', e.message); }
          }

          if (!clientId || !clientSecret) {
            console.error('Could not find OAuth credentials in firebase-tools');
            process.exit(1);
          }

          console.log('Found client_id:', clientId);

          const refreshToken = process.env.FIREBASE_TOKEN;
          const projectId = 'site-cg51';

          function post(hostname, path, data, headers) {
            return new Promise((resolve, reject) => {
              const body = typeof data === 'string' ? data : JSON.stringify(data);
              const req = https.request({ hostname, path, method: 'POST',
                headers: { 'Content-Type': headers || 'application/json',
                           'Content-Length': Buffer.byteLength(body), ...( headers === 'form' ? {} : {} ) }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve(JSON.parse(d)));
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          function postForm(hostname, path, params) {
            const body = new URLSearchParams(params).toString();
            return new Promise((resolve, reject) => {
              const req = https.request({ hostname, path, method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded',
                           'Content-Length': Buffer.byteLength(body) }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve(JSON.parse(d)));
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          function postAuth(path, data, token) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify(data);
              const req = https.request({
                hostname: 'identitytoolkit.googleapis.com',
                path, method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body),
                  'Authorization': `Bearer ${token}`
                }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve(JSON.parse(d)));
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          async function main() {
            // Get access token
            const tokenResp = await postForm('oauth2.googleapis.com', '/token', {
              grant_type: 'refresh_token',
              refresh_token: refreshToken,
              client_id: clientId,
              client_secret: clientSecret
            });

            if (!tokenResp.access_token) {
              console.error('Token error:', JSON.stringify(tokenResp));
              process.exit(1);
            }
            const accessToken = tokenResp.access_token;
            console.log('Got access token OK');

            const accounts = [
              ['apprenti@cg51-virtuel.fr',   'Acacia1'],
              ['compagnon@cg51-virtuel.fr',  'Equerre2'],
              ['maitre@cg51-virtuel.fr',     'Temple3'],
              ['tresorier@cg51-virtuel.fr',  'Caisse4'],
              ['vm@cg51-virtuel.fr',         'Orient5'],
              ['architecte@cg51-virtuel.fr', 'Loge051'],
            ];

            for (const [email, password] of accounts) {
              const lookup = await postAuth(
                `/v1/projects/${projectId}/accounts:lookup`,
                { email: [email] }, accessToken
              );
              if (!lookup.users || !lookup.users[0]) {
                console.error(`NOT FOUND: ${email}`);
                continue;
              }
              const localId = lookup.users[0].localId;
              const update = await postAuth(
                `/v1/projects/${projectId}/accounts:update`,
                { localId, password }, accessToken
              );
              if (update.localId) {
                console.log(`OK: ${email}`);
              } else {
                console.error(`FAILED: ${email}:`, JSON.stringify(update));
              }
            }
            console.log('\nDone.');
          }

          main().catch(e => { console.error(e); process.exit(1); });
          EOF
