name: Update Firebase Passwords

on:
  workflow_dispatch:

jobs:
  update-passwords:
    runs-on: ubuntu-latest
    steps:
      - name: Update all grade account passwords
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: site-cg51
        run: |
          # Get OAuth access token from the Firebase CI refresh token
          RESPONSE=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=refresh_token&refresh_token=${FIREBASE_TOKEN}&client_id=563584335869-fgrhgmd47bqnekij5i8b5pr03ho849e6.apps.googleusercontent.com&client_secret=j9iVZfS8sFxnc6T7SrMW5Dtt")

          ACCESS_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))")

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Could not get access token. Response: $RESPONSE"
            exit 1
          fi

          echo "Got access token successfully."

          # Function to look up a user by email and update their password
          update_password() {
            local EMAIL="$1"
            local NEW_PASS="$2"

            # Lookup user by email to get localId
            LOOKUP=$(curl -s -X POST \
              "https://identitytoolkit.googleapis.com/v1/projects/${PROJECT_ID}/accounts:lookup" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"email\":[\"${EMAIL}\"]}")

            LOCAL_ID=$(echo "$LOOKUP" | python3 -c "import sys,json; d=json.load(sys.stdin); users=d.get('users',[]); print(users[0]['localId'] if users else '')")

            if [ -z "$LOCAL_ID" ]; then
              echo "ERROR: User not found: $EMAIL"
              return 1
            fi

            # Update password
            UPDATE=$(curl -s -X POST \
              "https://identitytoolkit.googleapis.com/v1/projects/${PROJECT_ID}/accounts:update" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"localId\":\"${LOCAL_ID}\",\"password\":\"${NEW_PASS}\"}")

            UPDATED_ID=$(echo "$UPDATE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('localId','ERROR'))")

            if [ "$UPDATED_ID" = "ERROR" ] || [ -z "$UPDATED_ID" ]; then
              echo "ERROR updating $EMAIL: $UPDATE"
              return 1
            fi

            echo "OK: $EMAIL → password updated"
          }

          # Update all 6 accounts
          update_password "apprenti@cg51-virtuel.fr"   "Acacia1"
          update_password "compagnon@cg51-virtuel.fr"  "Equerre2"
          update_password "maitre@cg51-virtuel.fr"     "Temple3"
          update_password "tresorier@cg51-virtuel.fr"  "Caisse4"
          update_password "vm@cg51-virtuel.fr"         "Orient5"
          update_password "architecte@cg51-virtuel.fr" "Loge051"

          echo ""
          echo "All passwords updated."
