name: Update Firebase Passwords

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-firebase-passwords.yml'
  workflow_dispatch:

jobs:
  update-passwords:
    runs-on: ubuntu-latest
    steps:
      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Update all grade account passwords
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          node << 'EOF'
          const https = require('https');
          const fs = require('fs');
          const { execSync } = require('child_process');

          const FB = '/usr/local/lib/node_modules/firebase-tools';
          const refreshToken = process.env.FIREBASE_TOKEN;
          const projectId = 'site-cg51';

          // Find the client_id and client_secret used by this version of firebase-tools
          function findOAuthCreds() {
            // Search all JS files for googleusercontent.com client credentials
            let files;
            try {
              files = execSync(
                `grep -rl "googleusercontent.com" "${FB}/lib/" 2>/dev/null`,
                { encoding: 'utf8' }
              ).trim().split('\n').filter(Boolean);
            } catch(e) { files = []; }

            for (const f of files) {
              const src = fs.readFileSync(f, 'utf8');
              // Match both quoted-key and unquoted-key patterns
              const patterns = [
                /client_id["'\s:,{(]+([0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com)/,
                /["']([0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com)["']/,
              ];
              let clientId = null;
              for (const p of patterns) {
                const m = src.match(p);
                if (m) { clientId = m[1]; break; }
              }
              if (!clientId) continue;

              // Find client_secret near the client_id (search up to 500 chars after)
              const cidIdx = src.indexOf(clientId);
              const window = src.slice(Math.max(0, cidIdx - 500), cidIdx + 500);
              const csMatch = window.match(/client.secret["'\s:,]+["']([A-Za-z0-9_\-]{20,})["']/);
              if (!csMatch) continue;

              console.log('Found in:', f);
              return { clientId, clientSecret: csMatch[1] };
            }
            return null;
          }

          function postForm(hostname, path, params) {
            const body = new URLSearchParams(params).toString();
            return new Promise((resolve, reject) => {
              const req = https.request({
                hostname, path, method: 'POST',
                headers: {
                  'Content-Type': 'application/x-www-form-urlencoded',
                  'Content-Length': Buffer.byteLength(body)
                }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => { try { resolve(JSON.parse(d)); } catch(e) { reject(new Error(d)); } });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          function postAuth(path, data, token) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify(data);
              const req = https.request({
                hostname: 'identitytoolkit.googleapis.com',
                path, method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body),
                  'Authorization': 'Bearer ' + token
                }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => { try { resolve(JSON.parse(d)); } catch(e) { reject(new Error(d)); } });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          async function getAccessTokenViaFirebaseTools() {
            // Try using firebase-tools' own auth module directly
            try {
              const authModule = require(FB + '/lib/auth');
              const exports_ = Object.keys(authModule);
              console.log('firebase-tools auth exports:', exports_);

              // Try getAccessToken if available
              if (authModule.getAccessToken) {
                const result = await authModule.getAccessToken(refreshToken, []);
                return result.access_token || result;
              }
              // Try refreshAccessToken
              if (authModule.refreshAccessToken) {
                const result = await authModule.refreshAccessToken(refreshToken);
                return result.access_token || result;
              }
            } catch(e) {
              console.log('Direct auth module failed:', e.message);
            }
            return null;
          }

          async function main() {
            let accessToken = null;

            // Strategy 1: use firebase-tools internal auth
            accessToken = await getAccessTokenViaFirebaseTools();

            // Strategy 2: extract OAuth creds from firebase-tools and exchange manually
            if (!accessToken) {
              const creds = findOAuthCreds();
              if (!creds) {
                console.error('Could not find OAuth credentials or auth function in firebase-tools');
                // Print what files exist for debugging
                const files = execSync(`ls "${FB}/lib/"`, { encoding: 'utf8' });
                console.log('lib/ contents:', files.slice(0, 500));
                process.exit(1);
              }
              console.log('Using client_id:', creds.clientId);
              const tokenResp = await postForm('oauth2.googleapis.com', '/token', {
                grant_type: 'refresh_token',
                refresh_token: refreshToken,
                client_id: creds.clientId,
                client_secret: creds.clientSecret
              });
              if (!tokenResp.access_token) {
                console.error('Token error:', JSON.stringify(tokenResp));
                process.exit(1);
              }
              accessToken = tokenResp.access_token;
            }

            console.log('Got access token OK');

            const accounts = [
              ['apprenti@cg51-virtuel.fr',   'Acacia1'],
              ['compagnon@cg51-virtuel.fr',  'Equerre2'],
              ['maitre@cg51-virtuel.fr',     'Temple3'],
              ['tresorier@cg51-virtuel.fr',  'Caisse4'],
              ['vm@cg51-virtuel.fr',         'Vene66451..'],
              ['architecte@cg51-virtuel.fr', 'Lorenzo66.2'],
            ];

            for (const [email, password] of accounts) {
              const lookup = await postAuth(
                `/v1/projects/${projectId}/accounts:lookup`,
                { email: [email] }, accessToken
              );

              if (!lookup.users || !lookup.users[0]) {
                // Account doesn't exist — create it
                const created = await postAuth(
                  `/v1/projects/${projectId}/accounts`,
                  { email, password, emailVerified: true }, accessToken
                );
                if (created.localId) {
                  console.log('CREATED:', email);
                } else {
                  console.error('CREATE FAILED:', email, JSON.stringify(created));
                }
              } else {
                // Account exists — update its password
                const localId = lookup.users[0].localId;
                const update = await postAuth(
                  `/v1/projects/${projectId}/accounts:update`,
                  { localId, password }, accessToken
                );
                if (update.localId) {
                  console.log('UPDATED:', email);
                } else {
                  console.error('UPDATE FAILED:', email, JSON.stringify(update));
                }
              }
            }
            console.log('\nAll done.');
          }

          main().catch(e => { console.error(e); process.exit(1); });
          EOF
