name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'

      - name: Configurer la Worker Route lcg51.fr → comte-guifr
        run: |
          TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          ZONE_ID="27ebe52773ea37f19a1cc29b41ff4cb5"

          echo "=== Routes Worker actuelles pour lcg51.fr ==="
          ROUTES=$(curl -s "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" \
            -H "Authorization: Bearer ${TOKEN}")
          echo "$ROUTES"

          # Chercher si une route lcg51.fr/* existe déjà
          ROUTE_ID=$(echo "$ROUTES" | node -e "
            process.stdin.on('data',d=>{
              const r=JSON.parse(d);
              const route=(r.result||[]).find(x=>x.pattern==='lcg51.fr/*'||x.pattern==='*lcg51.fr/*');
              console.log(route?.id||'');
            })")

          if [ -n "$ROUTE_ID" ]; then
            echo "Route existante ($ROUTE_ID) — mise à jour vers comte-guifr"
            RESP=$(curl -s -X PUT \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes/${ROUTE_ID}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"pattern":"lcg51.fr/*","script":"comte-guifr"}')
          else
            echo "Aucune route — création lcg51.fr/* → comte-guifr"
            RESP=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"pattern":"lcg51.fr/*","script":"comte-guifr"}')
          fi

          echo "$RESP" | node -e "process.stdin.on('data',d=>{
            const r=JSON.parse(d);
            console.log(r.success?'✅ Route lcg51.fr/* → comte-guifr OK':'⚠️  '+JSON.stringify(r.errors||r));
          });"

      - name: Nettoyer Worker velum-temple (si présent)
        run: |
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"

          RESP=$(curl -s -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/velum-temple" \
            -H "Authorization: Bearer ${TOKEN}")

          echo "$RESP" | node -e "process.stdin.on('data',d=>{
            const r=JSON.parse(d);
            if(r.success) console.log('✅ velum-temple supprimé');
            else if(JSON.stringify(r).includes('10007')||JSON.stringify(r).includes('not found')) console.log('ℹ️  velum-temple déjà absent');
            else console.log('⚠️  ',JSON.stringify(r.errors||r));
          });"
