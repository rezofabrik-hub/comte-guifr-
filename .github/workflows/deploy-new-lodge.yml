name: Déployer une nouvelle loge Velum

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Identifiant unique (ex: loge-lumiere-75)'
        required: true
      lodge_name:
        description: 'Nom complet de la loge'
        required: true
      initial_password:
        description: 'Mot de passe administrateur initial'
        required: true
      custom_domain:
        description: 'Domaine personnalisé (laisser vide pour slug.fraternapp.com)'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Déployer ${{ inputs.slug }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Générer les fichiers du site pour cette loge ──────────────────
      - name: Générer le site de la loge
        run: |
          mkdir -p dist/${{ inputs.slug }}
          sed \
            -e 's|__VELUM_SLUG__|${{ inputs.slug }}|g' \
            -e 's|__VELUM_LODGE_NAME__|${{ inputs.lodge_name }}|g' \
            velum-template/index.html > dist/${{ inputs.slug }}/index.html
          if [ -d velum-template/assets ]; then
            cp -r velum-template/assets dist/${{ inputs.slug }}/
          fi

      # ── 2. Déployer sur Cloudflare Pages via API directe ────────────────
      - name: Déployer sur Cloudflare Pages
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLUG: ${{ inputs.slug }}
        run: |
          PROJECT=velum-${SLUG}

          # Créer le projet Pages s'il n'existe pas
          CREATE_RESP=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${PROJECT}\",\"production_branch\":\"main\"}")
          echo "Create project: $CREATE_RESP" | head -c 300

          # Test liste projets (debug)
          echo "=== Liste projets ==="
          LIST_RESP=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects" \
            -H "Authorization: Bearer ${CF_TOKEN}")
          echo "$LIST_RESP" | python3 -c "import sys,json,os; d=json.loads(sys.stdin.read()); print('OK' if d.get('success') else 'FAIL: '+str(d.get('errors')))"

          # Upload fichier index.html
          UPLOAD_RESP=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${PROJECT}/deployments" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -F "index.html=@dist/${SLUG}/index.html;type=text/html")
          echo "Upload: $UPLOAD_RESP" | head -c 300
          echo "$UPLOAD_RESP" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); r=d.get('result') or {}; print('Deploy:', r.get('url','?'), 'success:', d.get('success'), 'errors:', d.get('errors'))"

      # ── 3. Enregistrer la loge dans le registre KV ───────────────────────
      - name: Enregistrer la loge dans KV
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLUG: ${{ inputs.slug }}
          LODGE_NAME: ${{ inputs.lodge_name }}
        run: |
          KV_RESP=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/storage/kv/namespaces/bf2daa2ce915450599a4de04d554e99d/values/lodge%3A${SLUG}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"slug\":\"${SLUG}\",\"name\":\"${LODGE_NAME}\",\"created\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          echo "KV: $KV_RESP"
          echo "$KV_RESP" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print('KV success:', d.get('success'), 'errors:', d.get('errors',''))"

      # ── 4. Créer l'utilisateur Firebase admin ────────────────────────────
      - name: Créer utilisateur Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LODGE_SLUG: ${{ inputs.slug }}
          CONTACT_EMAIL: ${{ inputs.slug }}@fraternapp.com
          INITIAL_PASSWORD: ${{ inputs.initial_password }}
        run: |
          npm install firebase-admin --silent
          NODE_PATH=$(pwd)/node_modules node - <<'EOF'
          const { initializeApp, cert } = require('firebase-admin/app');
          const { getAuth } = require('firebase-admin/auth');
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          initializeApp({ credential: cert(sa) });

          (async () => {
            try {
              await getAuth().createUser({
                email: process.env.CONTACT_EMAIL,
                password: process.env.INITIAL_PASSWORD,
                displayName: `Admin ${process.env.LODGE_SLUG}`,
              });
              console.log('Utilisateur Firebase créé :', process.env.CONTACT_EMAIL);
            } catch (e) {
              if (e.code === 'auth/email-already-exists') {
                console.log('Utilisateur déjà existant — ok');
              } else {
                throw e;
              }
            }
            process.exit(0);
          })();
          EOF

      # ── 5. Résumé ─────────────────────────────────────────────────────────
      - name: Résumé du déploiement
        run: |
          DOMAIN="${{ inputs.custom_domain }}"
          URL="${DOMAIN:-${{ inputs.slug }}.fraternapp.com}"
          echo "### Loge déployée avec succès" >> $GITHUB_STEP_SUMMARY
          echo "- **Slug** : ${{ inputs.slug }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Nom** : ${{ inputs.lodge_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL** : https://$URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Pages** : https://velum-${{ inputs.slug }}.pages.dev" >> $GITHUB_STEP_SUMMARY
