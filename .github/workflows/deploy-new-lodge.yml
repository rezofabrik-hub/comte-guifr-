name: Déployer une Nouvelle Loge

# Ce workflow crée une loge complète :
#   1. Déploie le site statique sur Cloudflare Workers (domaine propre à la loge)
#   2. Crée les 6 comptes Firebase Auth (grade@{slug}.velum.fr)
#   3. Initialise Firestore avec le nom de la loge
#
# Prérequis secrets GitHub :
#   CLOUDFLARE_API_TOKEN      — token Cloudflare avec permission Workers:Edit
#   CLOUDFLARE_ACCOUNT_ID     — ID du compte Cloudflare
#   FIREBASE_SERVICE_ACCOUNT_FR — clé JSON du compte de service Firebase (project: site-cg51)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'ID unique de la loge (ex: loge-lumiere) — sera le sous-domaine : loge-lumiere.velum.fr'
        required: true
        type: string
      lodge_name:
        description: 'Nom complet (ex: R∴L∴ Les Trois Colonnes n°42)'
        required: true
        type: string
      domain:
        description: 'Domaine complet (ex: loge-lumiere.velum.fr ou loge-lumiere.fr)'
        required: true
        type: string
      initial_password:
        description: 'Mot de passe initial pour tous les comptes (min 8 car.) — changeable ensuite par l'architecte'
        required: true
        type: string
        default: 'Temple2025!'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le dossier de déploiement
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          mkdir -p "lodges/$SLUG/dist"
          cp index.html "lodges/$SLUG/dist/index.html"
          cp manifest.json "lodges/$SLUG/dist/manifest.json" 2>/dev/null || true
          cp -r icons "lodges/$SLUG/dist/icons" 2>/dev/null || true
          cp icon-192.png "lodges/$SLUG/dist/icon-192.png" 2>/dev/null || true
          cp icon-512.png "lodges/$SLUG/dist/icon-512.png" 2>/dev/null || true

          # Mettre à jour le titre HTML avec le nom de la loge
          LOGE_NAME="${{ github.event.inputs.lodge_name }}"
          sed -i "s|<title>Temple Virtuel</title>|<title>Temple Virtuel — $LOGE_NAME</title>|g" \
            "lodges/$SLUG/dist/index.html"

          # Mettre à jour le manifest
          sed -i "s|\"Temple Virtuel\"|\"$LOGE_NAME\"|g" "lodges/$SLUG/dist/manifest.json" 2>/dev/null || true

          # Créer wrangler.toml pour cette loge
          DOMAIN="${{ github.event.inputs.domain }}"
          WORKER_NAME="temple-$(echo $SLUG | tr '_' '-')"
          cat > "lodges/$SLUG/dist/wrangler.toml" << EOF
          name = "$WORKER_NAME"
          compatibility_date = "2026-01-01"

          [assets]
          directory = "."
          EOF

          echo "✅ Dossier de déploiement prêt pour : $LOGE_NAME ($SLUG)"

      - name: Déployer sur Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: lodges/${{ github.event.inputs.slug }}/dist

      - name: Créer les comptes Firebase Auth
        run: |
          node - <<'JSEOF'
          const https = require('https');
          const crypto = require('crypto');

          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_FR);
          const slug = process.env.SLUG;
          const password = process.env.INITIAL_PWD;
          const projectId = sa.project_id;

          const emails = {
            apprenti:   `apprenti@${slug}.velum.fr`,
            compagnon:  `compagnon@${slug}.velum.fr`,
            maitre:     `maitre@${slug}.velum.fr`,
            tresorier:  `tresorier@${slug}.velum.fr`,
            vm:         `vm@${slug}.velum.fr`,
            architecte: `architecte@${slug}.velum.fr`,
          };

          function b64url(str) {
            return Buffer.from(str).toString('base64')
              .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
          }

          async function getAccessToken() {
            const now = Math.floor(Date.now() / 1000);
            const header  = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
            const payload = b64url(JSON.stringify({
              iss: sa.client_email,
              scope: 'https://www.googleapis.com/auth/cloud-platform https://www.googleapis.com/auth/firebase',
              aud: 'https://oauth2.googleapis.com/token',
              exp: now + 3600, iat: now,
            }));
            const sign = crypto.createSign('RSA-SHA256');
            sign.update(`${header}.${payload}`);
            const sig = sign.sign(sa.private_key, 'base64')
              .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
            const jwt = `${header}.${payload}.${sig}`;

            return new Promise((resolve, reject) => {
              const body = `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`;
              const req = https.request({
                hostname: 'oauth2.googleapis.com', path: '/token', method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Content-Length': Buffer.byteLength(body) }
              }, res => {
                let d = ''; res.on('data', c => d += c);
                res.on('end', () => {
                  const r = JSON.parse(d);
                  r.access_token ? resolve(r.access_token) : reject(new Error(JSON.stringify(r)));
                });
              });
              req.on('error', reject); req.write(body); req.end();
            });
          }

          function apiPost(path, body, token) {
            return new Promise((resolve, reject) => {
              const data = JSON.stringify(body);
              const req = https.request({
                hostname: 'identitytoolkit.googleapis.com', path, method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(data),
                  'Authorization': 'Bearer ' + token
                }
              }, res => {
                let d = ''; res.on('data', c => d += c);
                res.on('end', () => { try { resolve(JSON.parse(d)); } catch(e) { resolve({}); } });
              });
              req.on('error', reject); req.write(data); req.end();
            });
          }

          (async () => {
            try {
              const token = await getAccessToken();
              for (const [grade, email] of Object.entries(emails)) {
                const res = await apiPost(
                  `/v1/projects/${projectId}/accounts`,
                  { email, password, emailVerified: true },
                  token
                );
                if (res.localId) {
                  console.log('✅ Créé :', email);
                } else if (res.error?.message?.includes('EMAIL_EXISTS')) {
                  // Mettre à jour le mot de passe si compte existant
                  const lookup = await apiPost(
                    `/v1/projects/${projectId}/accounts:lookup`,
                    { email: [email] }, token
                  );
                  if (lookup.users?.[0]?.localId) {
                    await apiPost(
                      `/v1/projects/${projectId}/accounts:update`,
                      { localId: lookup.users[0].localId, password },
                      token
                    );
                    console.log('🔄 Mis à jour :', email);
                  }
                } else {
                  console.error('⚠️ ', email, JSON.stringify(res.error || res));
                }
              }
              console.log('\n✅ Comptes Firebase créés/synchronisés');
            } catch(e) {
              console.error('❌', e.message);
              process.exit(1);
            }
          })();
          JSEOF
        env:
          SLUG: ${{ github.event.inputs.slug }}
          INITIAL_PWD: ${{ github.event.inputs.initial_password }}
          FIREBASE_SERVICE_ACCOUNT_FR: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FR }}

      - name: Initialiser Firestore — paramètres de base
        run: |
          node - <<'JSEOF'
          const https = require('https');
          const crypto = require('crypto');

          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_FR);
          const slug = process.env.SLUG;
          const lodgeName = process.env.LODGE_NAME;
          const projectId = sa.project_id;

          function b64url(str) {
            return Buffer.from(str).toString('base64')
              .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
          }

          async function getAccessToken() {
            const now = Math.floor(Date.now() / 1000);
            const header  = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
            const payload = b64url(JSON.stringify({
              iss: sa.client_email,
              scope: 'https://www.googleapis.com/auth/datastore',
              aud: 'https://oauth2.googleapis.com/token',
              exp: now + 3600, iat: now,
            }));
            const sign = crypto.createSign('RSA-SHA256');
            sign.update(`${header}.${payload}`);
            const sig = sign.sign(sa.private_key, 'base64')
              .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
            return new Promise((resolve, reject) => {
              const body = `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${b64url(JSON.stringify({alg:'RS256',typ:'JWT'}))}.${b64url(JSON.stringify({iss:sa.client_email,scope:'https://www.googleapis.com/auth/datastore',aud:'https://oauth2.googleapis.com/token',exp:now+3600,iat:now}))}.${sign.sign(sa.private_key,'base64').replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_')}`;
              // Simplified: just use gcloud REST
              const jwtBody = `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${header}.${payload}.${sig}`;
              const req = https.request({
                hostname: 'oauth2.googleapis.com', path: '/token', method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Content-Length': Buffer.byteLength(jwtBody) }
              }, res => {
                let d = ''; res.on('data', c => d += c);
                res.on('end', () => {
                  const r = JSON.parse(d);
                  r.access_token ? resolve(r.access_token) : reject(new Error(d));
                });
              });
              req.on('error', reject); req.write(jwtBody); req.end();
            });
          }

          async function setDoc(path, fields, token) {
            const body = JSON.stringify({ fields });
            return new Promise((resolve, reject) => {
              const req = https.request({
                hostname: 'firestore.googleapis.com',
                path: `/v1/projects/${projectId}/databases/(default)/documents/${path}`,
                method: 'PATCH',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body),
                  'Authorization': 'Bearer ' + token
                }
              }, res => {
                let d = ''; res.on('data', c => d += c);
                res.on('end', () => resolve(JSON.parse(d)));
              });
              req.on('error', reject); req.write(body); req.end();
            });
          }

          (async () => {
            try {
              const token = await getAccessToken();
              const basePath = `artifacts/${slug}/public/data/settings`;

              // Identité de la loge
              await setDoc(`${basePath}/identity`, {
                name: { stringValue: lodgeName },
                rite: { stringValue: '' },
                obedience: { stringValue: '' },
                orient: { stringValue: '' },
                maitreBanquet: { stringValue: '' },
                telBanquet: { stringValue: '' },
              }, token);

              // Message de bienvenue par défaut
              await setDoc(`${basePath}/welcome`, {
                text: { stringValue: '' },
              }, token);

              // Mots de passe (vide — seront renseignés par l'architecte)
              await setDoc(`${basePath}/gradesPasswords`, {
                apprenti:  { stringValue: process.env.INITIAL_PWD },
                compagnon: { stringValue: process.env.INITIAL_PWD },
                maitre:    { stringValue: process.env.INITIAL_PWD },
                tresorier: { stringValue: process.env.INITIAL_PWD },
                vm:        { stringValue: process.env.INITIAL_PWD },
                architecte:{ stringValue: process.env.INITIAL_PWD },
              }, token);

              console.log('✅ Firestore initialisé pour', lodgeName, '(appId:', slug, ')');
            } catch(e) {
              console.error('⚠️  Firestore init partielle :', e.message);
              // Non bloquant — la loge peut être configurée via l'UI
            }
          })();
          JSEOF
        env:
          SLUG: ${{ github.event.inputs.slug }}
          LODGE_NAME: ${{ github.event.inputs.lodge_name }}
          INITIAL_PWD: ${{ github.event.inputs.initial_password }}
          FIREBASE_SERVICE_ACCOUNT_FR: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FR }}

      - name: Résumé du déploiement
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          DOMAIN="${{ github.event.inputs.domain }}"
          LOGE_NAME="${{ github.event.inputs.lodge_name }}"
          PWD="${{ github.event.inputs.initial_password }}"

          echo "======================================================"
          echo "✅  LOGE DÉPLOYÉE : $LOGE_NAME"
          echo "======================================================"
          echo "🌐  Site         : https://$DOMAIN"
          echo "🗄️   AppID        : $SLUG"
          echo ""
          echo "📧  Comptes créés :"
          echo "    Apprenti   : apprenti@${SLUG}.velum.fr"
          echo "    Compagnon  : compagnon@${SLUG}.velum.fr"
          echo "    Maître     : maitre@${SLUG}.velum.fr"
          echo "    Trésorier  : tresorier@${SLUG}.velum.fr"
          echo "    V∴M∴       : vm@${SLUG}.velum.fr"
          echo "    Architecte : architecte@${SLUG}.velum.fr"
          echo ""
          echo "🔑  Mot de passe initial : $PWD"
          echo "⚠️   L'architecte doit changer tous les mots de passe"
          echo "    à la première connexion via l'interface Configuration."
          echo "======================================================"
