name: Déployer une nouvelle loge Velum

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Identifiant unique (ex: loge-lumiere-75)'
        required: true
      lodge_name:
        description: 'Nom complet de la loge'
        required: true
      initial_password:
        description: 'Mot de passe administrateur initial'
        required: true
      custom_domain:
        description: 'Domaine personnalisé (laisser vide pour slug.fraternapp.com)'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Déployer ${{ inputs.slug }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Générer les fichiers du site pour cette loge ──────────────────
      - name: Générer le site de la loge
        run: |
          mkdir -p dist/${{ inputs.slug }}
          sed \
            -e 's|__VELUM_SLUG__|${{ inputs.slug }}|g' \
            -e 's|__VELUM_LODGE_NAME__|${{ inputs.lodge_name }}|g' \
            velum-template/index.html > dist/${{ inputs.slug }}/index.html
          if [ -d velum-template/assets ]; then
            cp -r velum-template/assets dist/${{ inputs.slug }}/
          fi

      # ── 2. Déployer sur Cloudflare Pages via wrangler ───────────────────
      - name: Déployer sur Cloudflare Pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLUG: ${{ inputs.slug }}
        run: |
          PROJECT=velum-${SLUG}

          # Créer le projet Pages s'il n'existe pas (ignore l'erreur si déjà existant)
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${PROJECT}\",\"production_branch\":\"main\"}" | \
            python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print('Project:', 'created' if d.get('success') else d.get('errors',[{}])[0].get('message','?'))"

          # Déployer avec wrangler (gère le manifest automatiquement)
          npx wrangler@latest pages deploy dist/${SLUG} \
            --project-name=${PROJECT} \
            --branch=main \
            --commit-dirty=true
          echo "Pages URL: https://${PROJECT}.pages.dev"

      # ── 3. Enregistrer la loge dans le registre KV ───────────────────────
      - name: Enregistrer la loge dans KV
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLUG: ${{ inputs.slug }}
          LODGE_NAME: ${{ inputs.lodge_name }}
        run: |
          KV_RESP=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/storage/kv/namespaces/bf2daa2ce915450599a4de04d554e99d/values/lodge%3A${SLUG}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"slug\":\"${SLUG}\",\"name\":\"${LODGE_NAME}\",\"created\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          echo "KV: $KV_RESP"
          echo "$KV_RESP" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print('KV success:', d.get('success'), 'errors:', d.get('errors',''))"

      # ── 4. Créer l'utilisateur Firebase + enregistrer dans Firestore ────
      - name: Créer utilisateur Firebase et enregistrer la loge
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LODGE_SLUG: ${{ inputs.slug }}
          LODGE_NAME: ${{ inputs.lodge_name }}
          CONTACT_EMAIL: ${{ inputs.slug }}@fraternapp.com
          INITIAL_PASSWORD: ${{ inputs.initial_password }}
          PAGES_URL: https://velum-${{ inputs.slug }}.pages.dev
        run: |
          npm install firebase-admin --silent
          NODE_PATH=$(pwd)/node_modules node - <<'EOF'
          const { initializeApp, cert } = require('firebase-admin/app');
          const { getAuth } = require('firebase-admin/auth');
          const { getFirestore } = require('firebase-admin/firestore');
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          initializeApp({ credential: cert(sa) });

          (async () => {
            const auth = getAuth();
            const db = getFirestore();

            // Créer l'utilisateur admin
            try {
              await auth.createUser({
                email: process.env.CONTACT_EMAIL,
                password: process.env.INITIAL_PASSWORD,
                displayName: `Admin ${process.env.LODGE_SLUG}`,
              });
              console.log('Utilisateur Firebase créé :', process.env.CONTACT_EMAIL);
            } catch (e) {
              if (e.code === 'auth/email-already-exists') {
                console.log('Utilisateur déjà existant — ok');
              } else {
                throw e;
              }
            }

            // Enregistrer la loge dans Firestore (registre central)
            await db.collection('loges').doc(process.env.LODGE_SLUG).set({
              slug: process.env.LODGE_SLUG,
              name: process.env.LODGE_NAME,
              adminEmail: process.env.CONTACT_EMAIL,
              pagesUrl: process.env.PAGES_URL,
              createdAt: new Date().toISOString(),
              status: 'active',
            }, { merge: true });
            console.log('Loge enregistrée dans Firestore :', process.env.LODGE_SLUG);

            process.exit(0);
          })();
          EOF

      # ── 5. DNS — sous-domaine fraternapp.com ─────────────────────────────
      - name: Configurer le sous-domaine DNS
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: cf3648cabf480ab43564df0dc0897751
          SLUG: ${{ inputs.slug }}
        run: |
          # Créer CNAME slug.fraternapp.com → velum-slug.pages.dev
          DNS_RESP=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"CNAME\",\"name\":\"${SLUG}\",\"content\":\"velum-${SLUG}.pages.dev\",\"proxied\":true,\"ttl\":1,\"comment\":\"FraternApp loge ${SLUG}\"}")
          echo "DNS: $DNS_RESP"
          echo "$DNS_RESP" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print('DNS CNAME:', 'ok' if d.get('success') else d.get('errors','?'))"

          # Attacher le domaine personnalisé au projet Pages
          DOMAIN_RESP=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/velum-${SLUG}/domains" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${SLUG}.fraternapp.com\"}")
          echo "Pages domain: $DOMAIN_RESP"

      # ── 6. Email — routage slug@fraternapp.com ────────────────────────────
      - name: Configurer le routage email
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: cf3648cabf480ab43564df0dc0897751
          SLUG: ${{ inputs.slug }}
          DEST_EMAIL: rezofabrik@gmail.com
        run: |
          # Créer une règle de routage : slug@fraternapp.com → adresse de destination
          EMAIL_RESP=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/email/routing/rules" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"Loge ${SLUG}\",\"enabled\":true,\"matchers\":[{\"type\":\"literal\",\"field\":\"to\",\"value\":\"${SLUG}@fraternapp.com\"}],\"actions\":[{\"type\":\"forward\",\"value\":[\"${DEST_EMAIL}\"]}]}")
          echo "Email routing: $EMAIL_RESP"
          echo "$EMAIL_RESP" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print('Email routing:', 'ok' if d.get('success') else d.get('errors','?'))"

      # ── 8. Résumé ─────────────────────────────────────────────────────────
      - name: Résumé du déploiement
        run: |
          DOMAIN="${{ inputs.custom_domain }}"
          URL="${DOMAIN:-${{ inputs.slug }}.fraternapp.com}"
          echo "### Loge déployée avec succès" >> $GITHUB_STEP_SUMMARY
          echo "- **Slug** : ${{ inputs.slug }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Nom** : ${{ inputs.lodge_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL principale** : https://$URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Pages (CDN)** : https://velum-${{ inputs.slug }}.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Email admin** : ${{ inputs.slug }}@fraternapp.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> DNS et email routing actifs dans ~1 minute (propagation Cloudflare)." >> $GITHUB_STEP_SUMMARY
