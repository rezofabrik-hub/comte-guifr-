    <script type="module">

        if (!window.FB_API) {
            // @@FIREBASE_CONFIG_START@@
            const firebaseConfig = {
                apiKey: "AIzaSyA4IGmEv_bPt4Q5dnxjT2FIySP3JvAhQ20",
                authDomain: "site-cg51.firebaseapp.com",
                projectId: "site-cg51",
                storageBucket: "site-cg51.firebasestorage.app",
                messagingSenderId: "532992433947",
                appId: "1:532992433947:web:0ad401c53e6feeb0663dbe"
            };
            const LOGE_APP_ID = window.LOGE_APP_ID = (() => {
                const h = window.location.hostname;
                if (h === 'lcg51.fr') return 'site-cg51';
                if (h === 'localhost' || h === '127.0.0.1' || h.includes('pages.dev') || h.includes('workers.dev')) return 'site-cg51';
                return h.split('.')[0] || 'site-cg51';
            })();
            const LOGE_EMAIL_DOMAIN = window.LOGE_EMAIL_DOMAIN = (() => {
                const h = window.location.hostname;
                if (h === 'lcg51.fr') return 'cg51-virtuel.fr';
                if (h === 'localhost' || h === '127.0.0.1' || h.includes('pages.dev') || h.includes('workers.dev')) return 'cg51-virtuel.fr';

            // @@FIREBASE_CONFIG_END@@
            try {

                window.FB_API = {

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo, useCallback } = React;

        // @@LODGE_EMAILS_START@@
        const GRADE_ACCOUNTS = { apprenti: `apprenti@${LOGE_EMAIL_DOMAIN}`, compagnon: `compagnon@${LOGE_EMAIL_DOMAIN}`, maitre: `maitre@${LOGE_EMAIL_DOMAIN}`, tresorier: `tresorier@${LOGE_EMAIL_DOMAIN}`, vm: `vm@${LOGE_EMAIL_DOMAIN}`, secretaire: `secretaire@${LOGE_EMAIL_DOMAIN}` };
        const ARCHITECT_ACCOUNT = `architecte@${LOGE_EMAIL_DOMAIN}`;
        // @@LODGE_EMAILS_END@@
        const TRESOR_GRADES = ['tresorier', 'vm'];
        // --- HELPER IA ANALYSE ODJ (Gemini lit le PDF directement) ---
        const downloadFile = (url, name) => {
            if (!url || url === name) return; // ancien format invalide
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            document.body.appendChild(a);
            a.click();
            a.remove();
        };

        const analyzeODJWithAI = async (file, apiKey) => {
            const ab = await file.arrayBuffer();
            const bytes = new Uint8Array(ab);
            let binary = '';
            const chunkSize = 8192;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
            }
            const base64 = btoa(binary);
            const prompt = `Analyse cet ordre du jour maçonnique et retourne UNIQUEMENT un objet JSON valide (sans markdown) avec ces champs:\n- "date": date au format YYYY-MM-DD (l'année maçonnique ex: 6026=2026, 6025=2025)\n- "visibility": "Apprenti" si Premier degré, "Compagnon" si Deuxième degré, "Maître" si Troisième degré\n- "planche_auteur": nom complet de l'auteur de la planche (null si aucune planche explicite)\n- "planche_titre": titre exact de la planche entre guillemets (null si aucune)\n- "sujet": résumé en une phrase de l'objet principal des travaux`;
            const body = JSON.stringify({ contents: [{parts: [{inline_data: {mime_type: 'application/pdf', data: base64}}, {text: prompt}]}], generationConfig: { temperature: 0, maxOutputTokens: 512 } });
            // Découvrir les modèles disponibles pour cette clé
            const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
            let modelNames = ['gemini-2.0-flash','gemini-2.0-flash-lite','gemini-1.5-flash','gemini-1.5-pro'];
            if (listRes.ok) {
                const listData = await listRes.json();
                const available = (listData.models || [])
                    .filter(m => (m.supportedGenerationMethods||[]).includes('generateContent'))
                    .map(m => m.name.replace('models/',''))
                    .filter(n => n.includes('flash') || n.includes('pro'))
                    .filter(n => !n.includes('embed') && !n.includes('aqa'));
                if (available.length > 0) modelNames = available;
            }
            let lastErr = 'Aucun modèle disponible';
            for (const name of modelNames) {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${name}:generateContent?key=${apiKey}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body });
                if (res.ok) {
                    const data = await res.json();
                    let jsonStr = data.candidates[0].content.parts[0].text.trim();
                    if (jsonStr.startsWith('```')) jsonStr = jsonStr.replace(/```json?\n?/g,'').replace(/```/g,'').trim();
                    return JSON.parse(jsonStr);
                }
                const errBody = await res.json().catch(()=>({}));
                lastErr = 'Gemini ' + res.status + ' (' + name + '): ' + (errBody?.error?.message || '');
                if (res.status === 400 || res.status === 401 || res.status === 403) break;
            }
            throw new Error(lastErr);
        };

        const normalizeGrade = (g) => {
            const x = (g || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            if (x.includes('maitre')) return 'maitre';
            if (x.includes('compagnon')) return 'compagnon';
            return 'apprenti';
        };

        const LOGE_MEMBERS_INIT = [];

        const LIENS_INIT = [
            { t: "Hiram.be", d: "Le weblog de la Franc-Maçonnerie. Fondé en 2004.", u: "https://www.hiram.be/" },
            { t: "GADLU.INFO", d: "Franc-Maçonnerie Web Maçonnique.", u: "https://www.gadlu.info/" },
            { t: "Franc-Maçonnerie Française", d: " fm-fr.org - Portail institutionnel.", u: "https://www.fm-fr.org/" },
            { t: "Musée de la Franc-Maçonnerie", d: " godf.org - Histoire et symbolisme.", u: "https://museefm.org/" },
            { t: "RL Les Enfants de Phaleg", d: "rl-phaleg.fr - Rite Ecossais Rectifié.", u: "https://rl-phaleg.fr/" },

        // --- HELPER ICÔNES ---

                'Camera': 'fa-solid fa-camera', 'Calendar': 'fa-regular fa-calendar-days', 'Download': 'fa-solid fa-download',
                'Feather': 'fa-solid fa-feather-pointed', 'Utensils': 'fa-solid fa-utensils', 'Sparkles': 'fa-solid fa-wand-magic-sparkles',

            return <i className={`${iconMap[name] || 'fa-solid fa-circle-info'} ${className}`} style={{fontSize: size}}></i>;
        };

        const NavTab = ({ active, onClick, icon, label }) => (
            <button onClick={onClick} className={`flex items-center space-x-1.5 px-3 py-2 rounded-xl text-[10px] font-bold uppercase transition-all font-serif ${active ? 'bg-amber-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-amber-300'}`}>

            </button>
        );

        // ==========================================
        // VUES ET COMPOSANTS
        // ==========================================

        function LoginScreen({ onLogin, onArchitectLogin, error, logo, logeName }) {
            const [mode, setMode] = useState('member');
            const [n, sN] = useState(''); const [grade, setGrade] = useState(''); const [p, sP] = useState(''); const [genre, setGenre] = useState('frere');
            const [archPwd, setArchPwd] = useState('');
            const [showPwd, setShowPwd] = useState(false);
            const [showForgot, setShowForgot] = useState(false);
            const [members, setMembers] = useState([]);
            const [detected, setDetected] = useState(null); // { grade, label } auto-détecté

            // Charger les membres depuis Firestore (lecture publique) au montage
            useEffect(() => {
                fetch(`https://firestore.googleapis.com/v1/projects/${window.FB_API?.appId||'site-cg51'}/databases/(default)/documents/artifacts/${window.FB_API?.appId||'site-cg51'}/public/data/members?pageSize=200`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.documents) setMembers(data.documents.map(d => {
                            const f = d.fields || {};
                            return { name: f.name?.stringValue || '', role: f.role?.stringValue || '', grade: f.grade?.stringValue || '' };
                        }));
                    }).catch(() => {});
            }, []);

            // Normaliser : minuscules, sans accents, sans titres maçonniques
            const clean = (s) => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/frere |soeur |v∴m∴ |f\. |s\. /g,'').trim();

            // Auto-détecter le grade quand le nom change
            useEffect(() => {
                if (!n.trim() || members.length === 0) { setDetected(null); return; }
                const q = clean(n);
                const found = members.find(m => {
                    const mn = clean(m.name);
                    return mn.includes(q) || q.includes(mn) || mn.split(' ').some(part => part.length > 2 && q.includes(part));
                });
                if (!found) { setDetected(null); return; }
                const role = (found.role || '').toLowerCase();
                const g = (found.grade || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
                let key = '';
                if (role.includes('vénérable') || role.includes('venerable') || role.includes('vm')) key = 'vm';
                else if (role.includes('trésorier') || role.includes('tresorier')) key = 'tresorier';
                else if (g.includes('maitre') || g.includes('maître')) key = 'maitre';
                else if (g.includes('compagnon')) key = 'compagnon';
                else if (g.includes('apprenti')) key = 'apprenti';
                if (key) { setDetected({ key, label: { vm:'Vénérable Maître', tresorier:'Trésorier', maitre:'Maître', compagnon:'Compagnon', apprenti:'Apprenti' }[key] }); setGrade(key); }
                else setDetected(null);
            }, [n, members]);

            const GRADE_LABELS_LOGIN = { apprenti:'Apprenti', compagnon:'Compagnon', maitre:'Maître', tresorier:'Trésorier', secretaire:'Secrétaire', vm:'Vénérable Maître' };

            return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center p-6 text-center font-serif text-white animate-fade">

                        {error && <div className="bg-red-500/10 border border-red-500 text-red-200 p-4 rounded-xl text-xs mb-8 flex items-center gap-3 text-left font-sans font-bold"><SmartIcon name="AlertTriangle" />{error}</div>}
                        {mode === 'member' ? (

                                <div>
                                    <label className="text-xs text-slate-400 uppercase font-bold tracking-widest ml-1 mb-2 block font-sans">Nom complet</label>
                                    <input type="text" required placeholder="Votre nom..." className="w-full bg-slate-900 border border-slate-600 p-4 rounded-xl text-white outline-none focus:border-amber-500 shadow-inner" value={n} onChange={e=>sN(e.target.value)} />
                                    {detected && <p className="text-[10px] text-amber-400 font-bold mt-1.5 ml-1 flex items-center gap-1"><SmartIcon name="CheckCircle" size={11}/> Grade détecté : {detected.label}</p>}
                                </div>
                                <div>
                                    <label className="text-xs text-slate-400 uppercase font-bold tracking-widest ml-1 mb-2 block font-sans">Grade {detected ? <span className="text-amber-500 normal-case">(auto-détecté)</span> : ''}</label>
                                    <select value={grade} onChange={e=>{setGrade(e.target.value); setDetected(null);}} className={`w-full bg-slate-900 border p-4 rounded-xl text-white outline-none focus:border-amber-500 shadow-inner ${detected ? 'border-amber-500' : 'border-slate-600'}`}>
                                        <option value="">— Sélectionner —</option>
                                        <option value="apprenti">Apprenti</option>
                                        <option value="compagnon">Compagnon</option>
                                        <option value="maitre">Maître</option>

                                    </select>
                                </div>
                                <div><label className="text-xs text-slate-400 uppercase font-bold tracking-widest ml-1 mb-2 block font-sans">Clé de Grade</label><div className="relative"><input type={showPwd?'text':'password'} required placeholder="Mot de passe..." className="w-full bg-slate-900 border border-slate-600 p-4 rounded-xl text-white outline-none focus:border-amber-500 shadow-inner pr-12" value={p} onChange={e=>sP(e.target.value)} /><button type="button" onClick={()=>setShowPwd(v=>!v)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-amber-400 p-1"><SmartIcon name={showPwd?'EyeOff':'Eye'} size={18}/></button></div></div>
                                <button type="submit" className="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl uppercase tracking-widest transition-all shadow-lg mt-4 font-serif">FRAPPER À LA PORTE</button>

                                            <a href={`mailto:${ARCHITECT_ACCOUNT}`} className="flex items-center gap-2 text-amber-400 hover:text-amber-300 text-xs font-mono"><SmartIcon name="Mail" size={12}/> {ARCHITECT_ACCOUNT}</a>

                            </form>

                    </div>

        }

        const TOUS_LES_RITES = [
            'Rite Français','Rite Écossais Ancien et Accepté','Rite Écossais Rectifié',
            'Rite de Memphis-Misraïm','Rite de Misraïm',"Rite d'York","Rite d'Émulation",

            'Rite Américain','Rite Brasileño','Rite de Perfection (25 degrés)','Autre',
        ];

            'Grand Orient de France': ['Rite Français','Rite Écossais Ancien et Accepté','Rite Écossais Rectifié','Rite de Memphis-Misraïm',"Rite d'York",'Rite Français de Philalèthes','Rite National Français'],
            'Grande Loge de France': ['Rite Écossais Ancien et Accepté','Rite Écossais Rectifié','Rite de Memphis-Misraïm','Rite Français'],
            'Grande Loge Nationale Française': ['Rite Écossais Ancien et Accepté',"Rite d'York","Rite d'Émulation",'Rite Français','Rite Écossais Rectifié','Rite de Schröder','Rite de Swedenborg'],
            'Grande Loge Féminine de France': ['Rite Français','Rite Écossais Ancien et Accepté','Rite de Memphis-Misraïm'],
            'Droit Humain': ['Rite Écossais Ancien et Accepté','Rite de Memphis-Misraïm'],
            'Grande Loge Mixte de France': ['Rite Écossais Ancien et Accepté','Rite Français'],

            const [msg, setMsg] = useState(null);
            const [importing, setImporting] = useState(false);
            const toast = (text, type) => { setMsg({text,type}); setTimeout(()=>setMsg(null),4000); };

            const normalize = s => (s||'').toLowerCase()
                .normalize('NFD').replace(/[̀-ͯ]/g,'')
                .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();

            const importCoordonnees = async () => {
                setImporting(true);
                let ok = 0, skip = 0;
                for (const src of COORDONNEES_IMPORT) {
                    const srcKey = normalize(src.nom) + ' ' + normalize(src.prenom);
                    const match = members.find(m => {
                        const n = normalize(m.name||'').replace(/^(frere|soeur|f |s |vm |venerableA maitre )/,'');
                        return n.includes(normalize(src.nom)) && n.includes(normalize(src.prenom.split(' ')[0]));
                    });
                    if (match) {
                        await onUpdate(match.id, {
                            telephone: src.tel,
                            email: src.email,
                            adresse: src.adresse,
                            cp: src.cp,
                            ville: src.ville,
                            dateNaissance: src.ddn,
                        });
                        ok++;
                    } else {
                        skip++;
                        console.warn('Non trouvé:', srcKey);
                    }
                }
                setImporting(false);
                const skipMsg = skip > 0 ? ' · ' + skip + ' non trouvé' + (skip>1?'s':'') : '';
                toast(ok + ' membre' + (ok>1?'s':'') + ' mis à jour' + skipMsg, ok>0?'ok':'err');
            };

            const officiers = members.filter(m => isOfficierRole(m.role)).sort((a,b) => OFFICER_RANK(a.role) - OFFICER_RANK(b.role));
            const byGrade = g => {
                const gl = g.toLowerCase().replace('î','i');
                if(gl === 'maitre') {
                    const list = members.filter(m => isOfficierRole(m.role) || (m.grade||'').toLowerCase().replace('î','i').startsWith('maitre'));
                    // Ceux avec sautoir (rôle officier renseigné) en premier, sans rôle en dernier
                    return [...list].sort((a,b) => {
                        const aHas = !!(a.role && a.role.trim());
                        const bHas = !!(b.role && b.role.trim());
                        if (aHas && !bHas) return -1;
                        if (!aHas && bHas) return 1;
                        return 0;
                    });
                }
                return members.filter(m => !isOfficierRole(m.role) && (m.grade||'').toLowerCase().replace('î','i').startsWith(gl));
            };

            const Section = ({ icon, title, color, list, showGrade, logo }) => list.length === 0 ? null : (
                <div className="mb-10 animate-fade">
                    <div className={`flex items-center gap-3 border-b-2 pb-3 mb-6 ${color}`}>
                        {logo ? <div className="flex-shrink-0 opacity-80" style={{width:22,height:22,overflow:'hidden'}}>{React.cloneElement(logo, {width:22,height:22})}</div> : <SmartIcon name={icon} size={20}/>}
                        <h3 className="text-base font-bold uppercase tracking-widest font-serif">{title}</h3>
                        <span className="ml-auto text-[10px] font-bold opacity-60">{list.length} membre{list.length>1?'s':''}</span>
                    </div>
                    <div className={v==='grid' ? "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4" : "space-y-2"}>
                        {list.map(m => <MemberCard key={m.id} member={m} view={v} onUpdate={onUpdate} onDelete={onDelete} canEdit={canEdit} showGrade={showGrade}/>)}
                    </div>
                </div>
            );

            return (

                    <div className="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-6 rounded-2xl border mb-2 shadow-sm">
                        <div><h2 className="text-2xl font-serif">Tableau de Loge</h2><p className="text-slate-500 text-sm">{members.length} membres · Registre hiérarchique de la Loge.</p></div>
                        <div className="flex gap-2 flex-wrap justify-end">
                            <button onClick={()=>sV(v==='grid'?'list':'grid')} className="p-2 border rounded-lg text-amber-600">{v==='grid'?<SmartIcon name="List" size={20}/>:<SmartIcon name="LayoutGrid" size={20}/>}</button>
                            {canEdit && <button onClick={importCoordonnees} disabled={importing} className="border border-emerald-300 text-emerald-700 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 hover:bg-emerald-50 disabled:opacity-50" title="Importe automatiquement téléphone, email, adresse et date de naissance pour les 17 membres">{importing?<SmartIcon name="Loader" size={14} className="animate-spin"/>:<SmartIcon name="Download" size={14}/>}<span>Importer coordonnées</span></button>}
                            {canEdit && <button onClick={()=>sA(!isAdding)} className="bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center space-x-2 hover:bg-amber-700">{isAdding?<SmartIcon name="X" size={18}/>:<SmartIcon name="Plus" size={18}/>}<span>{isAdding?'Annuler':'Ajouter'}</span></button>}
                        </div>
                    </div>
                    {isAdding && <div className="bg-white p-6 rounded-2xl border shadow-lg mb-6"><MemberForm onSave={async(d)=>{try{await onAdd(d);sA(false);toast&&toast('Membre enregistré !','ok');}catch(e){toast&&toast('Erreur : '+(e?.code||e?.message||'impossible d\'enregistrer'),'err');}}} onCancel={()=>sA(false)}/></div>}
                    <Section title="Collège des Officiers" color="text-amber-700 border-amber-300" list={officiers} showGrade={false} logo={
                        <svg viewBox="0 0 80 80" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="40" cy="40" r="13" fill="#b45309"/>
                            <circle cx="40" cy="40" r="8" fill="#fbbf24"/>
                            {[0,30,60,90,120,150,180,210,240,270,300,330].map((a,i)=>{const r=Math.PI*a/180;return <line key={i} x1={40+18*Math.cos(r)} y1={40+18*Math.sin(r)} x2={40+26*Math.cos(r)} y2={40+26*Math.sin(r)} stroke="#b45309" strokeWidth="3.5" strokeLinecap="round"/>;})}
                        </svg>
                    }/>
                    <Section title="Tableau des Maîtres" color="text-amber-800 border-amber-400" list={byGrade('Maître')} showGrade={false} logo={GRADE_LOGO.maitre}/>
                    <Section title="Tableau des Compagnons" color="text-emerald-700 border-emerald-300" list={byGrade('Compagnon')} showGrade={false} logo={GRADE_LOGO.compagnon}/>
                    <Section title="Tableau des Apprentis" color="text-blue-700 border-blue-300" list={byGrade('Apprenti')} showGrade={false} logo={GRADE_LOGO.apprenti}/>
                </div>
            );
        }

        function AgendaForm({ initialData, onSave, onCancel, apiKey }) {
            const [f, s] = useState(initialData || { date: new Date().toISOString().split('T')[0], type:'Tenue Régulière', visibility:'Apprenti', sujet:'', agapes:'', entree:'', plat:'', dessert:'', lienFramadate:'', prix:'', planches: [], odjFile:null, odjVisibility:'Apprenti' });
            const [loading, setLoading] = useState(false);
            const [analyzing, setAnalyzing] = useState(false);
            const [saving, setSaving] = useState(false);
            const [saveError, setSaveError] = useState('');
            const [aiError, setAiError] = useState('');

            const [pendingFile, setPendingFile] = useState(null);

            const handleFileChange = async (e) => {
                const file = e.target.files[0]; if(!file) return;
                setPendingFile(file);
                setSaving(true);
                try {
                    const url = await window.FB_API.uploadFile(file, 'agenda-odj');
                    s(prev => ({...prev, odjFile: { name: file.name, data: url }}));
                } catch(err) {
                    setSaveError('Erreur upload : ' + (err?.message || err));
                } finally {
                    setSaving(false);
                }
            };

            const handleAnalyzeAI = async () => {
                if (!pendingFile && !f.odjFile) return;
                setAnalyzing(true); setAiError('');
                try {
                    const fileToAnalyze = pendingFile || new File([], f.odjFile.name);
                    if (!pendingFile) { setAiError('Rechargez le fichier pour l\'analyse IA.'); setAnalyzing(false); return; }
                    const result = await analyzeODJWithAI(pendingFile, apiKey);
                    s(prev => ({
                        ...prev,
                        date: result.date || prev.date,
                        visibility: result.visibility || prev.visibility,
                        sujet: result.sujet || prev.sujet,
                        planches: result.planche_auteur ? [{title: result.planche_titre || '', author: result.planche_auteur, grade: result.visibility}] : prev.planches
                    }));
                } catch(err) {
                    console.error("Erreur analyse ODJ", err);

                } finally { setAnalyzing(false); }
            };

            return (
                <form onSubmit={async(e)=>{e.preventDefault(); setSaving(true); setSaveError(''); try { await onSave({...f, sujet: f.sujet || f.type || 'Tenue'}); } catch(err) { setSaveError('Erreur lors de l\'enregistrement : ' + (err?.message || '')); } finally { setSaving(false); }}} className="space-y-6 font-sans text-sm text-slate-800 animate-fade">

                                    <button type="button" onClick={()=>{s({...f, odjFile: null}); setPendingFile(null);}} className="text-red-500 hover:text-red-700 font-bold text-[10px] uppercase underline">Retirer</button>
                                </div>
                                <div>
                                    <label className="text-[9px] font-bold text-amber-700 uppercase tracking-widest block mb-1">Visibilité de l'ODJ</label>
                                    <select value={f.odjVisibility || 'Apprenti'} onChange={e=>s({...f, odjVisibility:e.target.value})} className="border border-amber-200 p-2 rounded-xl bg-white font-bold text-amber-700 font-serif text-xs w-full">
                                        <option value="Apprenti">Tous les membres</option>
                                        <option value="Compagnon">Compagnons & Maîtres</option>
                                        <option value="Maître">Maîtres seulement</option>
                                    </select>
                                </div>
                            </div>
                        )}
                        {f.odjFile && apiKey && !analyzing && (
                            <button type="button" onClick={handleAnalyzeAI} className="mt-2 text-[10px] font-bold text-blue-600 hover:text-blue-800 uppercase underline">✨ Analyser avec l'IA</button>
                        )}
                        {loading && <p className="mt-2 text-[10px] font-bold text-amber-600 animate-pulse uppercase tracking-widest font-serif">Envoi du fichier...</p>}
                        {analyzing && <p className="mt-2 text-[10px] font-bold text-blue-600 animate-pulse uppercase tracking-widest font-serif">Analyse IA en cours...</p>}
                        {aiError && <p className="mt-2 text-[10px] font-bold text-red-500 uppercase">{aiError}</p>}
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 font-sans text-slate-800">
                        <input type="date" value={f.date} onChange={e=>s({...f,date:e.target.value})} className="border p-3 rounded-xl bg-slate-50 font-bold font-serif" required />
                        <input type="text" placeholder="Nature" value={f.type} onChange={e=>s({...f,type:e.target.value})} className="border p-3 rounded-xl bg-slate-50 font-bold font-serif" required />
                        <div>
                            <select value={f.visibility} onChange={e=>s({...f,visibility:e.target.value})} className="border p-3 rounded-xl bg-slate-50 font-bold text-amber-700 font-serif w-full">
                                <option value="Maître">Maître (Tous les grades)</option>
                                <option value="Compagnon">Compagnon (Compagnons & Maîtres)</option>
                                <option value="Apprenti">Apprenti (Tous les membres)</option>
                            </select>
                            <p className="text-[10px] text-slate-400 mt-1.5 font-sans px-1">
                                {f.visibility === 'Apprenti' && '👁 Tous les membres de la loge verront cette tenue et son ODJ.'}
                                {f.visibility === 'Compagnon' && '👁 Seuls les Compagnons et Maîtres verront cette tenue et son ODJ.'}
                                {f.visibility === 'Maître' && '👁 Seuls les Maîtres verront cette tenue et son ODJ.'}
                            </p>
                        </div>
                    </div>
                    
                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-4">
                        <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Détails des Agapes</h4>
                        <input type="text" placeholder="Nom de l'Intendant(e)" value={f.agapes} onChange={e=>s({...f,agapes:e.target.value})} className="w-full border p-3 rounded-xl bg-white font-bold font-serif" />
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <input type="text" placeholder="Entrée" value={f.entree} onChange={e=>s({...f,entree:e.target.value})} className="w-full border p-2 rounded-lg bg-white text-xs" />
                            <input type="text" placeholder="Plat" value={f.plat} onChange={e=>s({...f,plat:e.target.value})} className="w-full border p-2 rounded-lg bg-white text-xs" />
                            <input type="text" placeholder="Dessert" value={f.dessert} onChange={e=>s({...f,dessert:e.target.value})} className="w-full border p-2 rounded-lg bg-white text-xs" />
                        </div>
                        <input type="url" placeholder="Lien Framadate pour les inscriptions (Optionnel)" value={f.lienFramadate} onChange={e=>s({...f,lienFramadate:e.target.value})} className="w-full border p-2 rounded-lg bg-white text-xs text-amber-600" />
                        <div className="flex items-center gap-3">
                            <label className="text-[10px] font-bold text-slate-400 uppercase whitespace-nowrap">Prix agapes</label>
                            <input type="number" step="0.5" min="0" placeholder="ex: 10" value={f.prix||''} onChange={e=>s({...f,prix:e.target.value})} className="border p-2 rounded-lg bg-white text-xs w-24 font-bold text-amber-700" />
                            <span className="text-xs text-slate-400">€</span>
                        </div>
                    </div>

                    <textarea placeholder="Résumé de l'ordre du jour (facultatif)..." value={f.sujet} onChange={e=>s({...f,sujet:e.target.value})} className="w-full border p-4 rounded-xl h-24 outline-none focus:border-amber-500 shadow-inner font-serif"></textarea>
                    {f.planches && f.planches.length > 0 && (
                        <div className="bg-blue-50 p-4 rounded-xl border border-blue-200 animate-fade">
                            <p className="text-[10px] font-bold text-blue-700 uppercase tracking-widest mb-3 font-sans">Planche détectée automatiquement</p>
                            {f.planches.map((p, i) => (
                                <div key={i} className="bg-white p-3 rounded-lg border border-blue-100 space-y-2">
                                    <input type="text" value={p.title} onChange={e=>{const pl=[...f.planches]; pl[i]={...pl[i],title:e.target.value}; s({...f,planches:pl});}} placeholder="Titre de la planche" className="w-full border p-2 rounded text-sm font-bold outline-none focus:border-amber-500" />
                                    <input type="text" value={p.author} onChange={e=>{const pl=[...f.planches]; pl[i]={...pl[i],author:e.target.value}; s({...f,planches:pl});}} placeholder="Auteur" className="w-full border p-2 rounded text-sm outline-none focus:border-amber-500" />
                                    <select value={p.grade} onChange={e=>{const pl=[...f.planches]; pl[i]={...pl[i],grade:e.target.value}; s({...f,planches:pl});}} className="w-full border p-2 rounded text-sm outline-none focus:border-amber-500">
                                        <option>Apprenti</option><option>Compagnon</option><option>Maître</option>
                                    </select>
                                </div>

                            <button type="button" onClick={()=>s({...f,planches:[]})} className="mt-2 text-red-400 text-[10px] font-bold uppercase hover:underline">Effacer</button>

                    {saveError && <p className="text-red-500 text-xs font-bold text-center">{saveError}</p>}
                    <div className="flex justify-end gap-4 uppercase font-bold text-[10px] tracking-widest font-sans font-bold"><button type="button" onClick={onCancel} className="text-slate-400 font-sans">Annuler</button><button type="submit" disabled={saving||loading} className={`text-white px-10 py-3 rounded-xl shadow-lg font-serif transition-all ${saving||loading?'bg-slate-400 cursor-not-allowed':'bg-amber-600 hover:bg-amber-700'}`}>{saving ? 'Enregistrement...' : 'Enregistrer la tenue'}</button></div>
                </form>
            );
        }

        function AgendaView({ items, canEdit, onAdd, onUpdate, onDelete, canSee, apiKey }) {
            const [isA, sA] = useState(false);
            const [editingItem, setEditingItem] = useState(null);

            const [showPast, setShowPast] = useState(false);
            
            const today = new Date(); today.setHours(0,0,0,0);
            
            const upcomingItems = items.filter(i => new Date(i.date) >= today).sort((a,b) => new Date(a.date) - new Date(b.date));
            const pastItems = items.filter(i => new Date(i.date) < today).sort((a,b) => new Date(b.date) - new Date(a.date));

            const docs = items.filter(i => i.odjFile && canSee(i.odjVisibility || 'Apprenti'));

            const handleRemoveFile = async (id) => {
                const api = window.FB_API;
                await api.updateDoc(api.doc(api.db, 'artifacts', api.appId, 'public', 'data', 'agenda', id), { odjFile: null });
            };

            const RenderCard = ({ i }) => {
                return (
                    <div key={i.id} className="bg-white p-6 rounded-2xl border flex items-center justify-between hover:shadow-md transition-all group gap-6 text-slate-800">

                            <div className={`p-4 rounded-xl shadow-sm ${i.visibility==='Maître'?'bg-slate-100 text-slate-700':i.visibility==='Compagnon'?'bg-blue-50 text-blue-700':'bg-amber-50 text-amber-600'}`}><SmartIcon name={i.visibility==='Maître'?'Shield':i.visibility==='Compagnon'?'Star':'Calendar'} size={32} /></div>

                                    <p className="text-slate-600 text-sm italic leading-relaxed font-serif">"{i.sujet}"</p>
                                    
                                    {i.planches && i.planches.length > 0 && (

                                        </div>

                                        <div className="mt-2">

                                                <SmartIcon name="Download" size={13}/> Télécharger la planche des travaux
                                            </button>

                            {upcomingItems.length > 0 ? (
                                <div className="space-y-4">
                                    <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">À Venir</h3>
                                    {upcomingItems.map(i => <RenderCard key={i.id} i={i} />)}
                                </div>
                            ) : (
                                <p className="text-slate-400 italic py-10 text-center font-sans">Aucune tenue à venir.</p>
                            )}

                            {/* Archives des tenues passées */}
                            <div className="mt-8 pt-6 border-t border-slate-200">
                                <button 
                                    onClick={() => setShowPast(!showPast)} 
                                    className="w-full bg-slate-50 hover:bg-slate-100 p-4 rounded-xl border border-slate-200 flex items-center justify-between transition-all"
                                >
                                    <div className="flex items-center space-x-3 text-slate-600 font-bold">
                                        <SmartIcon name="Archive" size={20} className="text-amber-600"/>
                                        <span>Tenues Passées ({pastItems.length})</span>
                                    </div>
                                    <SmartIcon name={showPast ? "ChevronUp" : "ChevronDown"} size={16} className="text-slate-400"/>
                                </button>
                                
                                {showPast && (
                                    <div className="space-y-4 mt-4 animate-fade">
                                        {pastItems.length > 0 ? (
                                            pastItems.map(i => <RenderCard key={i.id} i={i} />)
                                        ) : (
                                            <p className="text-slate-400 italic py-6 text-center font-sans">Aucune tenue passée archivée pour le moment.</p>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-fade font-sans text-slate-800 font-sans">
                            {docs.map(f => (
                                <div key={f.id} className="bg-white p-6 rounded-2xl border flex flex-col shadow-sm hover:border-amber-400 transition-all group font-sans">
                                    <div className="flex items-center gap-4 mb-6 font-sans">
                                        <div className="p-3 bg-amber-50 text-amber-600 rounded-xl font-sans"><SmartIcon name="FileText" size={24}/></div>
                                        <div className="flex-grow min-w-0 font-serif font-bold"><p className="leading-tight truncate">{new Date(f.date).toLocaleDateString('fr-FR')}</p><p className="text-[10px] text-slate-400 font-bold uppercase mt-1 truncate font-sans">{f.type}</p></div>
                                    </div>
                                    <div className="flex items-center gap-2 border-t pt-4 mt-auto font-sans">
                                        <button onClick={()=>downloadFile(f.odjFile.data, f.odjFile.name)} className="flex-grow flex items-center justify-center gap-2 bg-amber-50 text-amber-700 font-black text-[10px] uppercase py-2.5 rounded-lg hover:bg-amber-100 transition-colors font-sans"><SmartIcon name="Download" size={14}/>Télécharger</button>
                                        {canEdit && (
                                            <ConfirmButton onConfirm={async()=>{ await handleRemoveFile(f.id); }} className="p-2.5 text-slate-300 hover:text-red-500 transition-colors font-sans" size={18} />
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function AddVisitorInline({ onAdd }) {
            const [open, setOpen] = useState(false);
            const empty = { nom: '', obedience: '', rite: '', grade: 'Maître' };
            const [f, sF] = useState(empty);
            const submit = (e) => { e.preventDefault(); if (!f.nom.trim()) return; onAdd(f); sF(empty); setOpen(false); };
            if (!open) return <button onClick={() => setOpen(true)} className="flex items-center gap-1.5 text-[10px] font-bold uppercase text-amber-600 hover:text-amber-700 transition-colors"><SmartIcon name="UserPlus" size={13}/>Ajouter un visiteur</button>;
            return (
                <form onSubmit={submit} className="flex flex-wrap gap-2 items-end bg-amber-50/50 p-3 rounded-xl border border-amber-100 w-full mt-2 animate-fade">
                    <input type="text" placeholder="Nom Prénom *" value={f.nom} onChange={e=>sF({...f,nom:e.target.value})} className="border p-2 rounded-lg text-xs flex-1 min-w-[140px] outline-none focus:border-amber-400" required/>
                    <input type="text" placeholder="Obédience" value={f.obedience} onChange={e=>sF({...f,obedience:e.target.value})} className="border p-2 rounded-lg text-xs w-28 outline-none focus:border-amber-400"/>
                    <input type="text" placeholder="Rite" value={f.rite} onChange={e=>sF({...f,rite:e.target.value})} className="border p-2 rounded-lg text-xs w-24 outline-none focus:border-amber-400"/>
                    <select value={f.grade} onChange={e=>sF({...f,grade:e.target.value})} className="border p-2 rounded-lg text-xs outline-none focus:border-amber-400"><option>Apprenti</option><option>Compagnon</option><option>Maître</option></select>
                    <button type="submit" className="bg-amber-600 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase hover:bg-amber-700">Ajouter</button>
                    <button type="button" onClick={() => setOpen(false)} className="text-slate-400 hover:text-slate-600 px-3 py-2 text-[10px] font-bold uppercase">Annuler</button>
                </form>
            );
        }

        function VisiteView({ items, canEdit, onUpdate, apiKey }) {
            const today = new Date(); today.setHours(0,0,0,0);
            const pastItems = items.filter(i => new Date(i.date) < today).sort((a,b) => new Date(b.date) - new Date(a.date));
            const [analyzing, setAnalyzing] = useState({});
            const [analyzingTicket, setAnalyzingTicket] = useState({});
            const [expandedId, setExpandedId] = useState(null);
            const [editingVisitor, setEditingVisitor] = useState(null); // { tenueId, idx, data }
            const [prixEdit, setPrixEdit] = useState({}); // { tenueId: string }

            const geminiImage = async (file, prompt) => {
                const reader = new FileReader();
                const photoData = await new Promise(res => { reader.onload = e => res(e.target.result); reader.readAsDataURL(file); });
                const base64 = photoData.split(',')[1];
                const mimeType = file.type || 'image/jpeg';
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ inline_data: { mime_type: mimeType, data: base64 } }, { text: prompt }] }], generationConfig: { temperature: 0, maxOutputTokens: 1024 } })
                });
                const data = await res.json();
                let txt = data.candidates[0].content.parts[0].text.trim();
                if (txt.startsWith('```')) txt = txt.replace(/```json?\n?/g,'').replace(/```/g,'').trim();
                return { photoData, parsed: JSON.parse(txt) };
            };

            const analyzePhoto = async (tenue, file) => {
                setAnalyzing(p => ({...p, [tenue.id]: true}));
                try {
                    const { photoData, parsed } = await geminiImage(file, `Analyse ce tableau de visiteurs maçonniques. Extrais les données de chaque ligne (ignore les signatures). Retourne UNIQUEMENT un tableau JSON valide sans markdown, avec pour chaque visiteur: {"nom": "Prénom NOM complet", "obedience": "obédience", "rite": "rite", "grade": "Apprenti|Compagnon|Maître"}. Si une valeur est illisible mets null.`);
                    const merged = [...(tenue.visitors||[])];
                    for (const v of parsed) {
                        if (v.nom && !merged.find(x => (x.nom||'').toLowerCase() === v.nom.toLowerCase())) merged.push({ ...v, agapes: false });
                    }
                    await onUpdate(tenue.id, { visitorsPhoto: { data: photoData, name: file.name }, visitors: merged });
                } catch(e) { console.error(e); alert('Erreur analyse visiteurs : ' + e.message); }
                setAnalyzing(p => ({...p, [tenue.id]: false}));
            };

            const analyzeTicket = async (tenue, file) => {
                setAnalyzingTicket(p => ({...p, [tenue.id]: true}));
                try {
                    const { photoData, parsed } = await geminiImage(file, `Analyse ce ticket de caisse. Retourne UNIQUEMENT un objet JSON valide sans markdown: {"total": montant_total_en_euros_nombre_decimal, "description": "résumé court du contenu"}. Exemple: {"total": 47.80, "description": "Courses Lidl — fruits, fromages, vins"}`);
                    const tickets = [...(tenue.agapesTickets||[]), { data: photoData, name: file.name, total: parsed.total||0, description: parsed.description||'' }];
                    const coutTotal = tickets.reduce((s,t) => s + (parseFloat(t.total)||0), 0);
                    await onUpdate(tenue.id, { agapesTickets: tickets, agapesCout: Math.round(coutTotal * 100) / 100 });
                } catch(e) { console.error(e); alert('Erreur analyse ticket : ' + e.message); }
                setAnalyzingTicket(p => ({...p, [tenue.id]: false}));
            };

            const removeTicket = async (tenue, idx) => {
                const tickets = (tenue.agapesTickets||[]).filter((_,i)=>i!==idx);
                const coutTotal = tickets.reduce((s,t) => s + (parseFloat(t.total)||0), 0);
                await onUpdate(tenue.id, { agapesTickets: tickets, agapesCout: Math.round(coutTotal * 100) / 100 });
            };

            const toggleAgapes = async (tenue, idx) => {
                const visitors = [...(tenue.visitors||[])];
                visitors[idx] = { ...visitors[idx], agapes: !visitors[idx].agapes };
                await onUpdate(tenue.id, { visitors });
            };
            const deleteVisitor = async (tenue, idx) => { await onUpdate(tenue.id, { visitors: (tenue.visitors||[]).filter((_,i)=>i!==idx) }); };
            const addVisitor = async (tenue, v) => { await onUpdate(tenue.id, { visitors: [...(tenue.visitors||[]), {...v, agapes: false}] }); };
            const saveEditVisitor = async (tenue, idx, v) => {
                const visitors = [...(tenue.visitors||[])];
                visitors[idx] = v;
                await onUpdate(tenue.id, { visitors });
                setEditingVisitor(null);
            };
            const savePrix = async (tenue, val) => {
                const prix = parseFloat(val) || 0;
                await onUpdate(tenue.id, { agapesPrixParPersonne: prix });
                setPrixEdit(p => ({...p, [tenue.id]: undefined}));
            };

            const gradeColor = (g='') => { const gl=g.toLowerCase(); return gl.includes('maître')||gl.includes('maitre') ? 'bg-slate-100 text-slate-600' : gl.includes('compagnon') ? 'bg-blue-50 text-blue-600' : 'bg-amber-50 text-amber-600'; };
            const fmt = (n) => (parseFloat(n)||0).toFixed(2).replace('.',',') + ' €';

            return (
                <div className="space-y-6 animate-fade font-sans text-slate-800">
                    <div className="bg-white p-6 rounded-2xl border flex justify-between items-center shadow-sm">
                        <div><h2 className="text-2xl font-bold font-serif text-slate-800">Registre des Visites</h2><p className="text-[10px] text-slate-400 uppercase tracking-widest font-bold mt-1">Tableau des visiteurs et finances agapes par tenue</p></div>
                        <SmartIcon name="UserCheck" size={28} className="text-amber-300"/>
                    </div>
                    {pastItems.length === 0 && <p className="text-slate-400 italic py-10 text-center">Aucune tenue passée.</p>}
                    {pastItems.map(tenue => {
                        const visitorsAgapes = (tenue.visitors||[]).filter(v=>v.agapes).length;
                        const prix = parseFloat(tenue.agapesPrixParPersonne)||0;
                        const cout = parseFloat(tenue.agapesCout)||0;
                        const recette = prix * visitorsAgapes;
                        const benefice = recette - cout;
                        return (
                        <div key={tenue.id} className="bg-white rounded-2xl border shadow-sm overflow-hidden">
                            <button onClick={() => setExpandedId(expandedId === tenue.id ? null : tenue.id)} className="w-full flex items-center justify-between p-5 hover:bg-slate-50 transition-all text-left">
                                <div className="flex items-center gap-4">
                                    <div className="p-3 bg-amber-50 text-amber-600 rounded-xl"><SmartIcon name="Users" size={20}/></div>
                                    <div>
                                        <p className="font-bold font-serif text-slate-800">{new Date(tenue.date).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
                                        <p className="text-[10px] text-slate-400 uppercase tracking-widest font-bold font-sans">{tenue.type} — <span className="text-amber-600">{(tenue.visitors||[]).length} visiteur{(tenue.visitors||[]).length!==1?'s':''}</span>{visitorsAgapes > 0 && <span className="text-slate-400"> · {visitorsAgapes} aux agapes</span>}{cout > 0 && <span className={`ml-2 ${benefice >= 0 ? 'text-green-600' : 'text-red-500'}`}>{benefice >= 0 ? '+' : ''}{fmt(benefice)}</span>}</p>
                                    </div>
                                </div>
                                <SmartIcon name={expandedId===tenue.id?'ChevronUp':'ChevronDown'} size={18} className="text-slate-400"/>
                            </button>

                            {expandedId === tenue.id && (
                                <div className="p-5 border-t border-slate-100 space-y-6 animate-fade">

                                    {/* === SECTION VISITEURS === */}
                                    <div className="space-y-4">
                                        <p className="text-[11px] font-black text-slate-700 uppercase tracking-widest border-b border-slate-100 pb-2">Tableau des visiteurs</p>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                            {/* Photo */}
                                            <div className="space-y-2">
                                                <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Photo du tableau de visiteurs</p>
                                                {tenue.visitorsPhoto ? (
                                                    <div className="space-y-2">
                                                        <img src={tenue.visitorsPhoto.data} alt="Tableau visiteurs" className="w-full rounded-xl border border-slate-200 object-contain max-h-72"/>
                                                        {canEdit && <label className="flex items-center justify-center gap-2 bg-slate-50 text-slate-500 font-bold text-[10px] uppercase py-2 rounded-lg hover:bg-amber-50 hover:text-amber-700 transition-colors cursor-pointer border border-slate-200">{analyzing[tenue.id]?<><SmartIcon name="Loader" size={12} className="animate-spin"/>Analyse...</>:<><SmartIcon name="RefreshCw" size={12}/>Changer (ré-analyser)</>}<input type="file" className="hidden" accept="image/*" onChange={e=>e.target.files[0]&&analyzePhoto(tenue,e.target.files[0])} disabled={analyzing[tenue.id]}/></label>}
                                                    </div>
                                                ) : (
                                                    canEdit ? (
                                                        <label className={`flex flex-col items-center justify-center gap-3 border-2 border-dashed rounded-xl p-8 cursor-pointer transition-all ${analyzing[tenue.id]?'border-amber-300 bg-amber-50/30':'border-slate-200 hover:border-amber-400 hover:bg-amber-50/20'}`}>
                                                            {analyzing[tenue.id]?<><SmartIcon name="Loader" size={28} className="text-amber-500 animate-spin"/><p className="text-[10px] font-bold text-amber-600 uppercase">Analyse en cours...</p></>:<><SmartIcon name="Camera" size={28} className="text-slate-300"/><p className="text-[10px] font-bold text-slate-400 uppercase text-center">Photo du tableau de visiteurs</p><p className="text-[9px] text-slate-300 text-center">L'IA extraira automatiquement les visiteurs</p></>}
                                                            <input type="file" className="hidden" accept="image/*" onChange={e=>e.target.files[0]&&analyzePhoto(tenue,e.target.files[0])} disabled={analyzing[tenue.id]}/>
                                                        </label>
                                                    ) : <div className="flex flex-col items-center justify-center gap-2 border border-slate-100 rounded-xl p-8 bg-slate-50"><SmartIcon name="Camera" size={24} className="text-slate-200"/><p className="text-[10px] text-slate-300 italic">Aucune photo</p></div>
                                                )}
                                            </div>
                                            {/* Résumé agapes */}
                                            <div className="bg-amber-50/50 rounded-xl border border-amber-100 p-4 flex flex-col">
                                                <p className="text-[10px] font-bold text-amber-700 uppercase tracking-widest mb-3 flex items-center gap-1"><SmartIcon name="Utensils" size={11}/>Restent aux agapes</p>
                                                {visitorsAgapes === 0 ? <p className="text-xs text-slate-400 italic flex-grow flex items-center">Aucun visiteur aux agapes</p> : (
                                                    <ul className="space-y-1.5 flex-grow">{(tenue.visitors||[]).filter(v=>v.agapes).map((v,i)=><li key={i} className="text-xs font-bold text-amber-800 flex items-center gap-1.5"><SmartIcon name="CheckCircle" size={12} className="text-amber-500 flex-shrink-0"/>{v.nom}</li>)}</ul>
                                                )}
                                                <div className="mt-4 pt-3 border-t border-amber-200"><p className="text-2xl font-black font-serif text-amber-600">{visitorsAgapes}<span className="text-[10px] font-bold text-amber-400 ml-1 font-sans">/ {(tenue.visitors||[]).length}</span></p><p className="text-[9px] text-amber-500 uppercase font-bold tracking-widest">visiteurs aux agapes</p></div>
                                            </div>
                                        </div>

                                        {/* Tableau visiteurs */}
                                        <div className="space-y-3">
                                            <div className="flex items-center justify-between flex-wrap gap-2">
                                                <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Visiteurs ({(tenue.visitors||[]).length})</p>
                                                {canEdit && <AddVisitorInline onAdd={v=>addVisitor(tenue,v)}/>}
                                            </div>
                                            {(tenue.visitors||[]).length === 0 ? (
                                                <p className="text-xs text-slate-400 italic text-center py-6 bg-slate-50 rounded-xl border border-dashed border-slate-200">Aucun visiteur — uploadez la photo du tableau pour extraction automatique.</p>
                                            ) : (
                                                <div className="overflow-x-auto rounded-xl border border-slate-100">
                                                    <table className="w-full text-xs font-sans">
                                                        <thead><tr className="bg-slate-50 text-[9px] font-black uppercase tracking-widest text-slate-400 border-b border-slate-100">
                                                            <th className="text-left p-3 pl-4">Nom & Prénom</th><th className="text-left p-3">Obédience</th><th className="text-left p-3">Rite</th><th className="text-left p-3">Grade</th>
                                                            <th className="text-center p-3 whitespace-nowrap"><SmartIcon name="Utensils" size={10} className="inline mr-1"/>Agapes</th>
                                                            {canEdit && <th className="p-3 w-16"></th>}
                                                        </tr></thead>
                                                        <tbody className="divide-y divide-slate-50">
                                                            {(tenue.visitors||[]).map((v,idx) => {
                                                                const isEditing = editingVisitor?.tenueId===tenue.id && editingVisitor?.idx===idx;
                                                                if (isEditing) return (
                                                                    <tr key={idx} className="bg-amber-50/40">
                                                                        <td className="p-2 pl-4"><input defaultValue={v.nom||''} onChange={e=>setEditingVisitor(p=>({...p,data:{...p.data,nom:e.target.value}}))} className="border p-1.5 rounded text-xs w-full outline-none focus:border-amber-400" placeholder="Nom Prénom"/></td>
                                                                        <td className="p-2"><input defaultValue={v.obedience||''} onChange={e=>setEditingVisitor(p=>({...p,data:{...p.data,obedience:e.target.value}}))} className="border p-1.5 rounded text-xs w-full outline-none focus:border-amber-400" placeholder="Obédience"/></td>
                                                                        <td className="p-2"><input defaultValue={v.rite||''} onChange={e=>setEditingVisitor(p=>({...p,data:{...p.data,rite:e.target.value}}))} className="border p-1.5 rounded text-xs w-full outline-none focus:border-amber-400" placeholder="Rite"/></td>
                                                                        <td className="p-2"><select defaultValue={v.grade||'Maître'} onChange={e=>setEditingVisitor(p=>({...p,data:{...p.data,grade:e.target.value}}))} className="border p-1.5 rounded text-xs outline-none focus:border-amber-400"><option>Apprenti</option><option>Compagnon</option><option>Maître</option></select></td>
                                                                        <td className="p-2 text-center"><input type="checkbox" defaultChecked={!!v.agapes} onChange={e=>setEditingVisitor(p=>({...p,data:{...p.data,agapes:e.target.checked}}))} className="w-4 h-4 accent-amber-600"/></td>
                                                                        <td className="p-2 text-right whitespace-nowrap"><button onClick={()=>saveEditVisitor(tenue,idx,editingVisitor.data)} className="text-green-600 hover:text-green-700 mr-2 font-bold text-[10px] uppercase">OK</button><button onClick={()=>setEditingVisitor(null)} className="text-slate-400 hover:text-slate-600 text-[10px] uppercase font-bold">✕</button></td>
                                                                    </tr>
                                                                );
                                                                return (
                                                                    <tr key={idx} className="hover:bg-slate-50/50 transition-colors">
                                                                        <td className="p-3 pl-4 font-bold text-slate-800">{v.nom||'—'}</td>
                                                                        <td className="p-3 text-slate-500">{v.obedience||'—'}</td>
                                                                        <td className="p-3 text-slate-500">{v.rite||'—'}</td>
                                                                        <td className="p-3"><span className={`px-2 py-0.5 rounded-full text-[9px] font-black uppercase ${gradeColor(v.grade)}`}>{v.grade||'—'}</span></td>
                                                                        <td className="p-3 text-center"><input type="checkbox" checked={!!v.agapes} onChange={()=>canEdit&&toggleAgapes(tenue,idx)} className="w-4 h-4 accent-amber-600 cursor-pointer"/></td>
                                                                        {canEdit && <td className="p-3 text-right whitespace-nowrap">
                                                                            <button onClick={()=>setEditingVisitor({tenueId:tenue.id,idx,data:{...v}})} className="text-slate-300 hover:text-amber-500 transition-colors mr-2"><SmartIcon name="Edit2" size={13}/></button>
                                                                            <ConfirmButton onConfirm={()=>deleteVisitor(tenue,idx)} className="text-slate-200 hover:text-red-400 transition-colors" size={13} />
                                                                        </td>}
                                                                    </tr>
                                                                );
                                                            })}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {/* === SECTION FINANCES AGAPES === */}
                                    <div className="space-y-4 pt-4 border-t border-slate-100">
                                        <p className="text-[11px] font-black text-slate-700 uppercase tracking-widest pb-2">Finances agapes</p>
                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">

                                            {/* Tickets de caisse */}
                                            <div className="lg:col-span-2 space-y-3">
                                                <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Tickets de caisse</p>
                                                {(tenue.agapesTickets||[]).map((t,i) => (
                                                    <div key={i} className="flex items-center gap-3 bg-slate-50 rounded-xl p-3 border border-slate-100">
                                                        <img src={t.data} alt="ticket" className="w-14 h-14 object-cover rounded-lg border border-slate-200 flex-shrink-0"/>
                                                        <div className="flex-grow min-w-0">
                                                            <p className="text-xs font-bold text-slate-700 truncate">{t.description||t.name}</p>
                                                            <p className="text-lg font-black font-serif text-slate-800">{fmt(t.total)}</p>
                                                        </div>
                                                        {canEdit && <ConfirmButton onConfirm={()=>removeTicket(tenue,i)} className="text-slate-200 hover:text-red-400 transition-colors flex-shrink-0" size={14} />}
                                                    </div>
                                                ))}
                                                {canEdit && (
                                                    <label className={`flex items-center justify-center gap-2 border-2 border-dashed rounded-xl p-4 cursor-pointer transition-all ${analyzingTicket[tenue.id]?'border-green-300 bg-green-50/30':'border-slate-200 hover:border-green-400 hover:bg-green-50/20'}`}>
                                                        {analyzingTicket[tenue.id]?<><SmartIcon name="Loader" size={18} className="text-green-500 animate-spin"/><p className="text-[10px] font-bold text-green-600 uppercase">Calcul du montant...</p></>:<><SmartIcon name="Receipt" size={18} className="text-slate-300"/><p className="text-[10px] font-bold text-slate-400 uppercase">Ajouter un ticket de caisse</p></>}
                                                        <input type="file" className="hidden" accept="image/*" onChange={e=>e.target.files[0]&&analyzeTicket(tenue,e.target.files[0])} disabled={analyzingTicket[tenue.id]}/>
                                                    </label>
                                                )}
                                                {(tenue.agapesTickets||[]).length > 0 && (
                                                    <div className="flex justify-between items-center bg-slate-100 rounded-xl p-3 font-sans">
                                                        <p className="text-[10px] font-black uppercase text-slate-500 tracking-widest">Total achats nourriture</p>
                                                        <p className="font-black text-slate-800 text-base">{fmt(cout)}</p>
                                                    </div>
                                                )}
                                            </div>

                                            {/* Bilan financier */}

                setUploading(true);
                try {
                    const url = await window.FB_API.uploadFile(file, `${LOGE_APP_ID}/bibliotheque`);
                    sF({...f, docFile: { name: file.name, data: url }});

            };

            return (
                <form onSubmit={async(e)=>{e.preventDefault(); await onSave(f);}} className="space-y-4 w-full">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" placeholder="Titre du document" value={f.title} onChange={e=>sF({...f,title:e.target.value})} className="border p-3 rounded-lg text-sm w-full font-bold outline-none focus:border-amber-500" required />

        function ReglementUploadForm({ reglementFile, onSaveReglement }) {
            const today = new Date().toISOString().split('T')[0];
            const [date, setDate] = useState(today);
            const [uploading, setUploading] = useState(false);
            const [showForm, setShowForm] = useState(false);
            const [err, setErr] = useState('');

            if (!showForm) return (
                <button onClick={()=>setShowForm(true)} className="text-[10px] text-amber-400 hover:text-amber-300 uppercase tracking-widest font-bold flex items-center transition-colors mt-1">
                    <SmartIcon name="Upload" size={12} className="mr-1"/> Mettre à jour

                <div className="bg-slate-800 border border-slate-700 rounded-xl p-4 mt-2 flex flex-col gap-3 min-w-[220px]">

                        <label className="text-[10px] font-bold text-red-400 uppercase block mb-1">Date de mise à jour *</label>

                            try {
                                const url = await window.FB_API.uploadFile(file, `${LOGE_APP_ID}/reglement`);
                                const history = reglementFile && reglementFile.data ? [...(reglementFile.history||[]), { name: reglementFile.name, data: reglementFile.data, modifiedAt: reglementFile.modifiedAt||'' }] : [];

            const nthWeekday = (year, month, weekday, n) => {
                const d = new Date(year, month, 1);
                let count = 0;
                while (d.getMonth() === month) {
                    if (d.getDay() === weekday) { count++; if (count === n) return new Date(d); }
                    d.setDate(d.getDate() + 1);
                }
                return null;
            };

            // Calcule les dates proposées en prenant le rythme courant en paramètre (évite les problèmes de closure)
            const calcDatesProposes = (r) => {
                const today = new Date(); today.setHours(0,0,0,0);
                const todayStr = today.toISOString().slice(0,10);
                // Juillet (6) et Août (7) = début de la nouvelle saison
                const sy = today.getMonth() >= 6 ? today.getFullYear() : today.getFullYear() - 1;
                const dates = [];
                const fmt = (d) => { const mm = String(d.getMonth()+1).padStart(2,'0'); const dd = String(d.getDate()).padStart(2,'0'); return `${d.getFullYear()}-${mm}-${dd}`; };
                for (let offset = 0; offset <= 1; offset++) {
                    const s = sy + offset, e = s + 1;
                    for (let m = 8; m <= 11; m++) for (const sem of r.semaines) { const d = nthWeekday(s, m, r.jourSemaine, sem); if (d) dates.push(fmt(d)); }
                    for (let m = 0; m <= 5; m++) for (const sem of r.semaines) { const d = nthWeekday(e, m, r.jourSemaine, sem); if (d) dates.push(fmt(d)); }
                }
                // Ne proposer que les dates futures (>= aujourd'hui)
                return dates.sort().filter(d => d >= todayStr);
