            const btn = "bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs uppercase tracking-widest px-6 py-3 rounded-xl shadow transition-all font-sans";

            return (
                <div className="max-w-2xl mx-auto py-4">
                    <h1 className="text-2xl font-serif font-bold mb-6 flex items-center gap-3"><SmartIcon name="Settings" size={24}/> Configuration de la Loge</h1>
                    {msg && <div className="mb-4 bg-green-50 border border-green-200 text-green-700 rounded-xl px-4 py-3 text-sm font-bold">{msg}</div>}

                    <div className={section}>
                        <h2 className="font-serif font-bold text-lg mb-4 flex items-center gap-2"><SmartIcon name="Building" size={18}/> Identité de la Loge</h2>
                        <div className="grid grid-cols-2 gap-4 mb-4">
                            <div><label className={label}>Nom de la Loge</label><input className={input} value={identity.name||''} onChange={e=>setIdentity(p=>({...p,name:e.target.value}))} placeholder="R∴L∴ Nom n°XX" /></div>
                            <div><label className={label}>Numéro</label><input className={input} value={identity.number||''} onChange={e=>setIdentity(p=>({...p,number:e.target.value}))} placeholder="51" /></div>
                            <div><label className={label}>Orient (Ville)</label><input className={input} value={identity.orient||''} onChange={e=>setIdentity(p=>({...p,orient:e.target.value}))} placeholder="Paris, Lyon..." /></div>
                            <div><label className={label}>Email contact</label><input className={input} value={identity.email||''} onChange={e=>setIdentity(p=>({...p,email:e.target.value}))} placeholder="contact@loge.fr" /></div>
                        </div>
                        <div className="mb-4">
                            <label className={label}>Obédience</label>
                            <div className="flex flex-wrap gap-2 mt-1">
                                {Object.keys(OBED_RITES).map(o=>(
                                    <button key={o} type="button" onClick={()=>setIdentity(p=>({...p,obedience:o,rite:''}))}
                                        className={`px-3 py-1.5 rounded-lg text-[11px] font-bold border transition-all ${identity.obedience===o?'bg-slate-800 text-white border-slate-800 shadow':'bg-slate-50 text-slate-600 border-slate-200 hover:border-amber-400 hover:text-amber-700'}`}>
                                        {o}
                                    </button>
                                ))}
                                {identity.obedience && !Object.keys(OBED_RITES).includes(identity.obedience) && (
                                    <button type="button" onClick={()=>setIdentity(p=>({...p,obedience:identity.obedience}))}
                                        className="px-3 py-1.5 rounded-lg text-[11px] font-bold border bg-slate-800 text-white border-slate-800 shadow">
                                        {identity.obedience}
                                    </button>
                                )}
                            </div>
                            <div className="flex gap-2 mt-2">
                                <input id="obed-custom" type="text" placeholder="Autre obédience..." className="border border-dashed border-slate-300 rounded-lg px-3 py-1.5 text-[11px] outline-none focus:border-amber-500 w-48" />
                                <button type="button" onClick={()=>{const v=document.getElementById('obed-custom').value.trim();if(v){setIdentity(p=>({...p,obedience:v,rite:''}));document.getElementById('obed-custom').value='';}}} className="px-3 py-1.5 rounded-lg text-[11px] font-bold bg-amber-600 text-white hover:bg-amber-500">+ Ajouter</button>
                            </div>
                        </div>
                        <div className="mb-6">
                            <label className={label}>Rite {identity.obedience && <span className="text-amber-600 normal-case font-normal">— filtré pour {identity.obedience}</span>}</label>
                            <div className="flex flex-wrap gap-2 mt-1">
                                {(OBED_RITES[identity.obedience]?[...OBED_RITES[identity.obedience],'Autre']:TOUS_LES_RITES).map(r=>(
                                    <button key={r} type="button" onClick={()=>setIdentity(p=>({...p,rite:r}))}
                                        className={`px-3 py-1.5 rounded-lg text-[11px] font-bold border transition-all ${identity.rite===r?'bg-amber-600 text-white border-amber-600 shadow':'bg-slate-50 text-slate-600 border-slate-200 hover:border-amber-400 hover:text-amber-700'}`}>
                                        {r}
                                    </button>
                                ))}
                                {identity.rite && ![...TOUS_LES_RITES,'Autre'].includes(identity.rite) && (
                                    <button type="button" onClick={()=>setIdentity(p=>({...p,rite:identity.rite}))}
                                        className="px-3 py-1.5 rounded-lg text-[11px] font-bold border bg-amber-600 text-white border-amber-600 shadow">
                                        {identity.rite}
                                    </button>
                                )}
                            </div>
                            <div className="flex gap-2 mt-2">
                                <input id="rite-custom" type="text" placeholder="Autre rite..." className="border border-dashed border-slate-300 rounded-lg px-3 py-1.5 text-[11px] outline-none focus:border-amber-500 w-48" />
                                <button type="button" onClick={()=>{const v=document.getElementById('rite-custom').value.trim();if(v){setIdentity(p=>({...p,rite:v}));document.getElementById('rite-custom').value='';}}} className="px-3 py-1.5 rounded-lg text-[11px] font-bold bg-amber-600 text-white hover:bg-amber-500">+ Ajouter</button>
                            </div>
                        </div>
                        <button onClick={saveIdentity} disabled={saving==='identity'} className={btn}>{saving==='identity'?'Sauvegarde...':'Sauvegarder l\'identité'}</button>
                    </div>

                    <div className={section}>
                        <h2 className="font-serif font-bold text-lg mb-4 flex items-center gap-2"><SmartIcon name="Image" size={18}/> Logo de la Loge</h2>
                        <div className="flex items-center gap-4">
                            {logeLogo && <img src={logeLogo} alt="Logo" className="w-16 h-16 object-contain rounded-xl border" />}
                            <label className="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs uppercase tracking-widest px-5 py-3 rounded-xl transition-all font-sans">
                                Changer le logo
                                <input type="file" accept="image/*" className="hidden" onChange={e=>{ if(e.target.files[0]) onSaveLogo(e.target.files[0]); }} />
                            </label>
                        </div>
                    </div>

                    <div className={section}>
                        <h2 className="font-serif font-bold text-lg mb-4 flex items-center gap-2"><SmartIcon name="MessageSquare" size={18}/> Message de bienvenue</h2>
                        <textarea className={`${input} h-24 resize-none`} value={welcome} onChange={e=>setWelcome(e.target.value)} placeholder="Message affiché sur le Parvis à la connexion..." />
                        <button onClick={saveWelcome} disabled={saving==='welcome'} className={`${btn} mt-3`}>{saving==='welcome'?'Sauvegarde...':'Sauvegarder le message'}</button>
                    </div>

                    <div className={section}>
                        <h2 className="font-serif font-bold text-lg mb-4 flex items-center gap-2"><SmartIcon name="Coins" size={18}/> Capitation annuelle (€)</h2>
                        <div className="grid grid-cols-2 gap-4 mb-4">
                            <div><label className={label}>Apprenti</label><input type="number" className={input} value={capitation.apprenti||''} onChange={e=>setCapitation(p=>({...p,apprenti:e.target.value}))} placeholder="0" /></div>
                            <div><label className={label}>Compagnon</label><input type="number" className={input} value={capitation.compagnon||''} onChange={e=>setCapitation(p=>({...p,compagnon:e.target.value}))} placeholder="0" /></div>
                            <div><label className={label}>Maître</label><input type="number" className={input} value={capitation.maitre||''} onChange={e=>setCapitation(p=>({...p,maitre:e.target.value}))} placeholder="0" /></div>
                            <div><label className={label}>Base (tous grades)</label><input type="number" className={input} value={capitation.base||''} onChange={e=>setCapitation(p=>({...p,base:e.target.value}))} placeholder="0" /></div>
                        </div>
                        <button onClick={saveCapitation} disabled={saving==='cap'} className={btn}>{saving==='cap'?'Sauvegarde...':'Sauvegarder la capitation'}</button>
                    </div>

                    <div className={section}>
                        <h2 className="font-serif font-bold text-lg mb-4 flex items-center gap-2"><SmartIcon name="Calendar" size={18}/> Tenues — Ordre des Travaux</h2>
                        <div className="mb-4">
                            <label className={label}>Jour habituel</label>
                            <select className={input} value={rythme.jourSemaine} onChange={e=>setRythme(p=>({...p, jourSemaine:parseInt(e.target.value)}))}>
                                {JOURS.map((j,i)=><option key={i} value={i}>{j}</option>)}
                            </select>
                        </div>
                        <div className="mb-5">
                            <label className={label}>Semaine(s) du mois</label>
                            <div className="flex gap-3 flex-wrap mt-1">
                                {SEMAINES.map(s=>(
                                    <label key={s.v} className="flex items-center gap-2 cursor-pointer">
                                        <input type="checkbox" checked={rythme.semaines.includes(s.v)} onChange={e=>setRythme(p=>({...p, semaines: e.target.checked ? [...p.semaines, s.v].sort() : p.semaines.filter(x=>x!==s.v)}))} className="w-4 h-4 accent-amber-600"/>
                                        <span className="text-sm font-bold text-slate-700">{s.l} {JOURS[rythme.jourSemaine]}</span>
                                    </label>
                                ))}
                            </div>
                        </div>

                        {!showDatePicker ? (
                            <div className="flex gap-3 flex-wrap">
                                <button onClick={ouvrirSelecteur} disabled={rythme.semaines.length===0} className={btn}>
                                    📅 Choisir les dates à ajouter
                                </button>
                                <button onClick={toutEffacer} disabled={saving==='effacer'} className="bg-red-600 hover:bg-red-500 text-white font-bold text-xs uppercase tracking-widest px-6 py-3 rounded-xl shadow transition-all font-sans">
                                    {saving==='effacer' ? 'Suppression...' : '🗑 Tout effacer à zéro'}
                                </button>
                            </div>
                        ) : (
                            <div className="border border-amber-200 rounded-2xl p-4 bg-amber-50">
                                <p className="text-xs font-bold text-amber-800 mb-3 uppercase tracking-widest">Cochez les dates à ajouter dans l'Ordre des Travaux :</p>
                                <div className="flex gap-2 mb-3">
                                    <button onClick={()=>setDatesSelectionnees([...datesProposes])} className="text-[10px] font-bold text-amber-700 underline">Tout cocher</button>
                                    <span className="text-slate-300">|</span>
                                    <button onClick={()=>setDatesSelectionnees([])} className="text-[10px] font-bold text-slate-400 underline">Tout décocher</button>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-2 max-h-72 overflow-y-auto pr-1">
                                    {datesProposes.map(d => {
                                        const checked = datesSelectionnees.includes(d);
                                        const dt = new Date(d + 'T12:00:00');
                                        const label2 = dt.toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'long', year:'numeric'});
                                        return (
                                            <div key={d} onClick={()=>toggleDate(d)} className={`flex items-center gap-2 p-2 rounded-lg cursor-pointer text-[11px] font-bold border transition-all ${checked ? 'bg-amber-600 text-white border-amber-600' : 'bg-white text-slate-600 border-slate-200 hover:border-amber-400'}`}>
                                                {label2}
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="flex gap-3 mt-4">
                                    <button onClick={ajouterDatesSelectionnees} disabled={saving==='tenues' || datesSelectionnees.length===0} className={btn}>
                                        {saving==='tenues' ? 'Ajout...' : `✓ Ajouter ${datesSelectionnees.length} date(s)`}
                                    </button>
                                    <button onClick={()=>setShowDatePicker(false)} className="text-slate-400 font-bold text-xs uppercase hover:text-slate-600">Annuler</button>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className={section}>
                        <h2 className="font-serif font-bold text-lg mb-4 flex items-center gap-2"><SmartIcon name="KeyRound" size={18}/> Mots de passe des grades</h2>
                        {Object.keys(savedPwds).length === 0 && (
                            <div className="mb-4 bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-800">
                                <strong>Première utilisation :</strong> cliquez sur Initialiser pour enregistrer les mots de passe actuels.
                                <button onClick={initPasswords} className="ml-4 bg-amber-600 text-white font-bold text-xs px-4 py-2 rounded-lg">Initialiser</button>
                            </div>
                        )}
                        <div className="mb-3 bg-blue-50 border border-blue-200 rounded-xl p-3 text-xs text-blue-800 font-sans">
                            <strong>Si "Mot de passe incorrect" à la connexion :</strong> entrez le mot de passe Firebase actuel (celui qui existait avant) dans le champ <span className="text-orange-600 font-bold">orange</span>, puis tapez le nouveau mot de passe et confirmez.
                        </div>
                        <div className="space-y-4">
                            {Object.keys(GRADE_LABELS).map(g => {
                                const [showCur, setShowCur] = React.useState(false);
                                const [showNew, setShowNew] = React.useState(false);
                                const [showFb, setShowFb] = React.useState(false);
                                return (
                                <div key={g} className="border border-slate-100 rounded-xl p-3 bg-slate-50 space-y-2">
                                    <span className="text-xs font-bold uppercase text-slate-600 font-sans block">{GRADE_LABELS[g]}</span>
                                    <div className="flex flex-wrap gap-2 items-center">
                                        <div className="relative flex items-center">
                                            <span className="text-[10px] text-slate-400 font-bold mr-1">Enregistré :</span>
                                            <input readOnly className="border border-slate-200 bg-white rounded-lg px-2 py-1.5 text-xs font-mono text-slate-600 w-28 pr-7" type={showCur?'text':'password'} value={savedPwds[g]||'—'} />
                                            <button type="button" onClick={()=>setShowCur(v=>!v)} className="absolute right-1.5 text-slate-400 hover:text-amber-600"><SmartIcon name={showCur?'EyeOff':'Eye'} size={12}/></button>
                                        </div>
                                    </div>
                                    <div className="flex flex-wrap gap-2 items-center">
                                        <div className="relative flex items-center">
                                            <span className="text-[10px] text-orange-500 font-bold mr-1">Firebase actuel :</span>
                                            <input className="border border-orange-300 bg-orange-50 rounded-lg px-2 py-1.5 text-xs font-mono text-slate-800 w-32 pr-7 outline-none focus:border-orange-500" type={showFb?'text':'password'} placeholder={savedPwds[g]?'••••••••':'mot de passe...'} value={currentPwds[g]||''} onChange={e=>setCurrentPwds(p=>({...p,[g]:e.target.value}))} />
                                            <button type="button" onClick={()=>setShowFb(v=>!v)} className="absolute right-1.5 text-orange-400 hover:text-orange-600"><SmartIcon name={showFb?'EyeOff':'Eye'} size={12}/></button>
                                        </div>
                                        <span className="text-[10px] text-slate-400">→</span>
                                        <div className="relative flex items-center flex-1 min-w-32">
                                            <span className="text-[10px] text-slate-400 font-bold mr-1">Nouveau :</span>
                                            <input className="flex-1 border border-slate-200 bg-white rounded-lg px-2 py-1.5 text-xs outline-none focus:border-amber-500 font-sans pr-7" type={showNew?'text':'password'} placeholder="Nouveau mot de passe..." value={pwds[g]} onChange={e=>setPwds(p=>({...p,[g]:e.target.value}))} />
                                            <button type="button" onClick={()=>setShowNew(v=>!v)} className="absolute right-1.5 text-slate-400 hover:text-amber-600"><SmartIcon name={showNew?'EyeOff':'Eye'} size={12}/></button>
                                        </div>
                                    </div>
                                    <button onClick={()=>changePassword(g)} disabled={saving==='pwd_'+g || !pwds[g]} className="bg-slate-800 hover:bg-amber-600 text-white font-bold text-xs px-4 py-2 rounded-xl transition-all font-sans disabled:opacity-30">{saving==='pwd_'+g?'...':'Confirmer'}</button>
                                </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* ── Comptes Membres Individuels ── */}
                    <MembresComptesSection api={api} FB_KEY={FB_KEY} />
                </div>
            );
        }

        function MembresComptesSection({ api, FB_KEY }) {
            const [membres, setMembres] = React.useState([]); // [{id, ...data}]
            const [statuts, setStatuts] = React.useState({});
            const [creerTout, setCreerTout] = React.useState(false);
            const [editPwd, setEditPwd] = React.useState({}); // {docId: newPwd}
            const [showPwd, setShowPwd] = React.useState({});

            const loadMembres = React.useCallback(() => {
                const col = api.collection(api.db, 'artifacts', api.appId, 'public', 'data', 'members');
                api.getDocs(col).then(snap => {
                    const list = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(m => m.name);
                    setMembres(list);
                }).catch(()=>{});
            }, [api]);

            React.useEffect(() => { loadMembres(); }, [loadMembres]);

            const normEmail = (name) => name.trim().toLowerCase()
                .normalize("NFD").replace(/[̀-ͯ]/g,"")
                .replace(/[^a-z\s-]/g,'').trim().replace(/\s+/g,'.');

            const genEmail = (m) => {
                const grade = (m.grade||'apprenti').toLowerCase().trim()
                    .normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,'');
                const gradeKey = grade.includes('maitre')||grade.includes('matre') ? 'maitre'
                    : grade.includes('compagnon') ? 'compagnon'
                    : grade.includes('tresor') ? 'tresorier' : 'apprenti';
                return `${gradeKey}.${normEmail(m.name)}@${LOGE_EMAIL_DOMAIN}`;
            };

            const genPwd = (name) => {
                const parts = name.trim().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z\s]/g,'').split(/\s+/);
                return parts.map(p=>p.charAt(0).toUpperCase()+p.slice(1).toLowerCase()).join('')+'27!';
            };

            const fbSignIn = async (email, pwd) => {
                const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FB_KEY}`,{
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ email, password: pwd, returnSecureToken: true })
                });
                return r.json();
            };

            const creerCompte = async (m) => {
                const id = m.id;
                setStatuts(s=>({...s,[id]:'...'}));
                const email = m.accountEmail || genEmail(m);
                const pwd = m.accountPwd || genPwd(m.name);
                try {
                    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB_KEY}`,{
                        method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({ email, password: pwd, returnSecureToken: true })
                    });
                    const d = await r.json();
                    if (d.error && d.error.message !== 'EMAIL_EXISTS') {
                        setStatuts(s=>({...s,[id]:'err:'+d.error.message}));
                        return;
                    }
                    // Sauvegarder email+pwd dans le doc membre
                    await api.updateDoc(api.doc(api.db,'artifacts',api.appId,'public','data','members',id), { accountEmail: email, accountPwd: pwd });
                    setStatuts(s=>({...s,[id]: d.error ? 'existe' : 'ok'}));
                    loadMembres();
                } catch(e) { setStatuts(s=>({...s,[id]:'err:'+e.message})); }
            };

            const changerMotDePasse = async (m) => {
                const id = m.id;
                const newPwd = (editPwd[id]||'').trim();
                if (!newPwd || newPwd.length < 6) return alert('Mot de passe trop court (min 6 caractères).');
                setStatuts(s=>({...s,[id]:'pwd...'}));
                const email = m.accountEmail || genEmail(m);
                const currentPwd = m.accountPwd || genPwd(m.name);
                try {
                    const sign = await fbSignIn(email, currentPwd);
                    if (!sign.idToken) { setStatuts(s=>({...s,[id]:'err:connexion'})); return; }
                    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:update?key=${FB_KEY}`,{
                        method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({ idToken: sign.idToken, password: newPwd, returnSecureToken: true })
                    });
                    const d = await r.json();
                    if (d.error) { setStatuts(s=>({...s,[id]:'err:'+d.error.message})); return; }
                    await api.updateDoc(api.doc(api.db,'artifacts',api.appId,'public','data','members',id), { accountPwd: newPwd });
                    setEditPwd(e=>({...e,[id]:''}));
                    setStatuts(s=>({...s,[id]:'pwd_ok'}));
                    loadMembres();
                } catch(e) { setStatuts(s=>({...s,[id]:'err:'+e.message})); }
            };

            const supprimerCompte = async (m) => {
                if (!confirm(`Supprimer le compte de ${m.name} ?`)) return;
                const id = m.id;
                setStatuts(s=>({...s,[id]:'del...'}));
                const email = m.accountEmail || genEmail(m);
                const pwd = m.accountPwd || genPwd(m.name);
                try {
                    const sign = await fbSignIn(email, pwd);
                    if (!sign.idToken) { setStatuts(s=>({...s,[id]:'err:connexion'})); return; }
                    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:delete?key=${FB_KEY}`,{
                        method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({ idToken: sign.idToken })
                    });
                    const d = await r.json();
                    if (d.error) { setStatuts(s=>({...s,[id]:'err:'+d.error.message})); return; }
                    await api.updateDoc(api.doc(api.db,'artifacts',api.appId,'public','data','members',id), { accountEmail: '', accountPwd: '' });
                    setStatuts(s=>({...s,[id]:'del_ok'}));
                    loadMembres();
                } catch(e) { setStatuts(s=>({...s,[id]:'err:'+e.message})); }
            };

            const creerTousComptes = async () => {
                setCreerTout(true);
                for (const m of membres) await creerCompte(m);
                setCreerTout(false);
            };

            if (membres.length === 0) return (
                <div className="bg-white rounded-2xl shadow p-5 border border-slate-100">
                    <h2 className="text-sm font-bold text-slate-700 font-sans uppercase tracking-widest mb-2">Comptes Membres Individuels</h2>
                    <p className="text-xs text-slate-400 font-sans">Aucun membre chargé.</p>
                </div>
            );

            return (
                <div className="bg-white rounded-2xl shadow p-5 border border-slate-100 space-y-4">
                    <div className="flex items-center justify-between flex-wrap gap-2">
                        <h2 className="text-sm font-bold text-slate-700 font-sans uppercase tracking-widest">Comptes Membres Individuels</h2>
                        <button onClick={creerTousComptes} disabled={creerTout} className="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-4 py-2 rounded-xl font-sans disabled:opacity-40">
                            {creerTout ? 'Création...' : 'Créer / Vérifier tous'}
                        </button>
                    </div>
                    <div className="text-[10px] text-slate-500 font-sans bg-slate-50 border border-slate-200 rounded-xl p-3">
                        Le membre se connecte avec son <strong>nom</strong> + son <strong>mot de passe</strong> — aucun email à retenir.<br/>
                        Les comptes Architecte et VM gardent leurs identifiants actuels.
                    </div>
                    <div className="space-y-3">
                        {membres.map(m => {
                            const pwd = m.accountPwd || genPwd(m.name);
                            const hasAccount = !!(m.accountEmail && m.accountEmail.length > 0);
                            const st = statuts[m.id] || '';
                            const isShowPwd = showPwd[m.id];
                            return (
                                <div key={m.id} className="border border-slate-100 rounded-xl px-3 py-3 space-y-2 text-xs font-sans">
                                    <div className="flex flex-wrap items-center gap-2">
                                        <span className="font-bold text-slate-700 w-36 truncate">{m.name}</span>
                                        <div className="flex items-center gap-1 flex-1">
                                            <span className="font-mono text-[10px] text-slate-600">{isShowPwd ? pwd : '••••••••'}</span>
                                            <button type="button" onClick={()=>setShowPwd(s=>({...s,[m.id]:!s[m.id]}))} className="text-slate-300 hover:text-amber-600 text-[10px] px-1">👁</button>
                                        </div>
                                        {!hasAccount
                                            ? <button onClick={()=>creerCompte(m)} disabled={st==='...'} className="bg-slate-800 hover:bg-amber-600 text-white font-bold text-[10px] px-3 py-1.5 rounded-lg transition-all disabled:opacity-40">
                                                {st==='...'?'...':st==='ok'?'✓ Créé':st==='existe'?'✓ Existe':st.startsWith('err')?'✗ Erreur':'Créer'}
                                              </button>
                                            : <span className="text-green-600 text-[10px] font-bold">✓ Actif</span>
                                        }
                                        {hasAccount && <button onClick={()=>supprimerCompte(m)} disabled={st.includes('...')} className="text-red-400 hover:text-red-600 font-bold text-[10px] px-2 py-1.5 rounded-lg border border-red-200 hover:border-red-400 transition-all disabled:opacity-40">
                                            {st==='del...'?'...':st==='del_ok'?'✓ Supprimé':'Supprimer'}
                                        </button>}
                                    </div>
                                    {hasAccount && (
                                        <div className="flex flex-wrap items-center gap-2 pt-1 border-t border-slate-50">
                                            <span className="text-[10px] text-slate-400">Nouveau mdp :</span>
                                            <input type="text" placeholder="Nouveau mot de passe..." value={editPwd[m.id]||''} onChange={e=>setEditPwd(p=>({...p,[m.id]:e.target.value}))}
                                                className="flex-1 min-w-32 border border-slate-200 rounded-lg px-2 py-1 text-xs font-mono outline-none focus:border-amber-400" />
                                            <button onClick={()=>changerMotDePasse(m)} disabled={!editPwd[m.id] || st==='pwd...'} className="bg-slate-700 hover:bg-amber-600 text-white font-bold text-[10px] px-3 py-1.5 rounded-lg transition-all disabled:opacity-40">
                                                {st==='pwd...'?'...':st==='pwd_ok'?'✓ Modifié':'Modifier'}
                                            </button>
                                        </div>
                                    )}
                                    {st.startsWith('err') && <div className="text-red-500 text-[10px]">{st.replace('err:','Erreur : ')}</div>}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // ==========================================
        // COMPOSANT MAÎTRE (APP)
        // ==========================================

        function App() {
            const api = window.FB_API;
            const [fbUser, setFbUser] = useState(null);
            const [fbError, setFbError] = useState(null);
            const [isLogged, setIsLogged] = useState(false);
            const [memberName, setMemberName] = useState('');
            const [memberRole, setMemberRole] = useState('');
            const [memberGenre, setMemberGenre] = useState('frere');
            const [activeView, setActiveView] = useState('home');
            const [unlockedGrades, setUnlockedGrades] = useState({ apprenti: false, compagnon: false, maitre: false });
            const [pendingGrade, setPendingGrade] = useState('');
            const [showGradesMenu, setShowGradesMenu] = useState(false);
            const [members, setMembers] = useState([]);
            const [agendaItems, setAgendaItems] = useState([]);
            const [planches, setPlanches] = useState([]);
            const [books, setBooks] = useState([]);
            const [liens, setLiens] = useState([]);
            const [logeLogo, setLogeLogo] = useState(null);
            const [logeIdentity, setLogeIdentity] = useState({ name: '', rite: '', obedience: '', orient: '', maitreBanquet: '', telBanquet: '' });
            const [welcomeText, setWelcomeText] = useState('');
            const [reglementFile, setReglementFile] = useState(null);
            const [claudeApiKey, setClaudeApiKey] = useState('');
            const [showApiKeyModal, setShowApiKeyModal] = useState(false);
            const [apiKeyInput, setApiKeyInput] = useState('');
            const [savingKey, setSavingKey] = useState(false);
            const [keyError, setKeyError] = useState('');
            const [selectedPlanche, setSelectedPlanche] = useState(null);
            const [isArchitect, setIsArchitect] = useState(false);
            const [isTresorier, setIsTresorier] = useState(false);
            const [loginGradeKey, setLoginGradeKey] = useState('');
            const [pendingNameMatch, setPendingNameMatch] = useState('');

            const isVM = loginGradeKey === 'vm';
            const isSecretaire = loginGradeKey === 'secretaire' ||
                (!!memberRole && (memberRole.toLowerCase().includes('secrétaire') || memberRole.toLowerCase().includes('secretaire')));

            // canEdit : écriture réservée au Vénérable Maître et à l'Architecte uniquement
            const canEdit = isVM || isArchitect;
            const canEditAgenda = canEdit || isSecretaire;
            const hasTresorAccess = isTresorier || isVM || isArchitect;

            // Auth + données : tout dans un seul effet, les listeners Firestore démarrent
            // DANS onAuthStateChanged pour éviter toute condition de course
            useEffect(() => {
                if (!api) return;
                let dataUnsubs = [];

                const stopData = () => { dataUnsubs.forEach(fn => fn()); dataUnsubs = []; };

                const startData = (u) => {
                    const path = (c) => api.collection(api.db, 'artifacts', api.appId, 'public', 'data', c);
                    const onErr = (e) => setFbError('Erreur : ' + (e?.code || e?.message || ''));
                    const DEFAULT_WELCOME = "Bienvenue, mes Très Chères Sœurs et mes Très Chers Frères,\n\nCe temple virtuel est le vôtre — un espace de partage et de lumière au service de notre Loge. Vous y trouverez des Planches à lire et à méditer, ainsi que notre Chaîne d'Union, reflet des liens fraternels qui nous unissent.\n\nPuisse chaque visite enrichir votre chemin initiatique.\n\nFraternellement.";
                    dataUnsubs.push(
                        api.onSnapshot(api.doc(api.db,'artifacts',api.appId,'public','data','settings','branding'), d => d.exists() && setLogeLogo(d.data().logoData)),
                        api.onSnapshot(api.doc(api.db,'artifacts',api.appId,'public','data','settings','identity'), d => d.exists() ? setLogeIdentity(prev=>({...prev,...d.data()})) : setLogeIdentity({name:'',rite:'',obedience:'',orient:'',maitreBanquet:'',telBanquet:''})),
                        api.onSnapshot(api.doc(api.db,'artifacts',api.appId,'public','data','settings','welcome'), d => d.exists() ? setWelcomeText(d.data().text||DEFAULT_WELCOME) : setWelcomeText(DEFAULT_WELCOME)),
                        api.onSnapshot(api.doc(api.db,'artifacts',api.appId,'public','data','settings','reglement'), d => d.exists() ? setReglementFile(d.data()) : setReglementFile(null)),
                        api.onSnapshot(api.doc(api.db,'artifacts',api.appId,'public','data','settings','claudeapi'), d => { if(d.exists()){setClaudeApiKey(d.data().key||'');setApiKeyInput(d.data().key||'');} }),
                        api.onSnapshot(path('members'), s => {
                            setMembers(s.docs.map(d=>({id:d.id,...d.data()})));
                        }, onErr),
                        api.onSnapshot(path('agenda'), s => setAgendaItems(s.docs.map(d=>({id:d.id,...d.data()}))), onErr),
                        api.onSnapshot(path('planches'), s => setPlanches(s.docs.map(d=>({id:d.id,...d.data()}))), onErr),
                        api.onSnapshot(path('bibliotheque'), s => setBooks(s.docs.map(d=>({id:d.id,...d.data()}))), onErr),
                        api.onSnapshot(path('liens'), async s => {
                            if (s.empty) {
                                try { const b=api.writeBatch(api.db); LIENS_INIT.forEach(l=>b.set(api.doc(path('liens')),l)); await b.commit(); }
                                catch(e) {}
                            } else { setLiens(s.docs.map(d=>({id:d.id,...d.data()}))); }
                        }, onErr)
                    );
                };

                const unsubAuth = api.onAuthStateChanged(api.auth, u => {
                    stopData();
                    setFbUser(u);
                    if (!u) {
                        sessionStorage.removeItem('lgMemberName');
                        setIsLogged(false);
                        setMembers([]); setAgendaItems([]); setPlanches([]); setBooks([]); setLiens([]);
                        return;
                    }
                    const email = u.email || '';
                    if (email === ARCHITECT_ACCOUNT) {
                        setIsArchitect(true); setIsLogged(true);
                        setUnlockedGrades({apprenti:true,compagnon:true,maitre:true});
                        setLoginGradeKey('architecte');
                    } else {
                        const gradeByEmail = Object.entries(GRADE_ACCOUNTS).find(([,e]) => e === email);
                        if (gradeByEmail) {
                            const [gradeKey] = gradeByEmail;
                            const grades = gradeKey==='maitre' ? {apprenti:true,compagnon:true,maitre:true}
                                : gradeKey==='compagnon' ? {apprenti:true,compagnon:true,maitre:false}
                                : gradeKey==='tresorier'||gradeKey==='vm'||gradeKey==='secretaire' ? {apprenti:true,compagnon:true,maitre:true}
                                : {apprenti:true,compagnon:false,maitre:false};
                            setUnlockedGrades(grades);
                            setLoginGradeKey(gradeKey);
                            setIsTresorier(gradeKey==='tresorier');
                            setMemberRole(gradeKey==='vm'?'Vénérable Maître':gradeKey==='tresorier'?'Trésorier':gradeKey==='secretaire'?'Secrétaire':'');
                            const savedName = sessionStorage.getItem('lgMemberName');
                            if (savedName) { setMemberName(savedName); setPendingNameMatch(savedName); }
                            if (gradeKey==='secretaire') setActiveView('agenda');
                            setIsLogged(true);
                        } else {
                            // Compte membre individuel : grade.prenom.nom@domain
                            const [local, domain] = email.split('@');
                            if (domain === LOGE_EMAIL_DOMAIN) {
                                const emailParts = local.split('.');
                                const gradePrefix = emailParts[0];
                                const gradeKeys = Object.keys(GRADE_ACCOUNTS);
                                const matchedGrade = gradeKeys.find(k => k === gradePrefix);
                                if (matchedGrade) {
                                    const grades = matchedGrade==='maitre' ? {apprenti:true,compagnon:true,maitre:true}
                                        : matchedGrade==='compagnon' ? {apprenti:true,compagnon:true,maitre:false}
                                        : matchedGrade==='tresorier' ? {apprenti:true,compagnon:true,maitre:true}
                                        : {apprenti:true,compagnon:false,maitre:false};
                                    const nameFromEmail = emailParts.slice(1).map(p=>p.charAt(0).toUpperCase()+p.slice(1)).join(' ');
                                    setUnlockedGrades(grades);
                                    setLoginGradeKey(matchedGrade);
                                    setIsTresorier(matchedGrade==='tresorier');
                                    setMemberRole(matchedGrade==='tresorier'?'Trésorier':'');
                                    setPendingNameMatch(nameFromEmail);
                                    setIsLogged(true);
                                }
                            }
                        }
                    }
                    startData(u);
                });

                return () => { unsubAuth(); stopData(); };
            }, [api]);

            const normalizeName = (str) => str.trim().toLowerCase()
                .normalize("NFD").replace(/[̀-ͯ]/g, "")
                .replace(/[^a-z\s-]/g, '').trim().replace(/\s+/g, '.');

            const handleLogin = async (n, gradeKey, p, genre) => {
                const grades = gradeKey === 'maitre' ? { apprenti:true, compagnon:true, maitre:true }
                    : gradeKey === 'compagnon' ? { apprenti:true, compagnon:true, maitre:false }
                    : gradeKey === 'tresorier' || gradeKey === 'vm' || gradeKey === 'secretaire' ? { apprenti:true, compagnon:true, maitre:true }
                    : { apprenti:true, compagnon:false, maitre:false };

                // Essayer d'abord le compte individuel (sauf vm)
                if (gradeKey !== 'vm') {
                    const indivEmail = `${gradeKey}.${normalizeName(n)}@${LOGE_EMAIL_DOMAIN}`;
                    try {
                        await api.signInWithEmailAndPassword(api.auth, indivEmail, p.trim());
                        setUnlockedGrades(grades);
                        setIsArchitect(false);
                        setIsTresorier(gradeKey === 'tresorier');
                        setLoginGradeKey(gradeKey);
                        setMemberName(n.trim());
                        setMemberRole(gradeKey === 'tresorier' ? 'Trésorier' : gradeKey === 'secretaire' ? 'Secrétaire' : '');
                        setMemberGenre(genre || 'frere');
                        setPendingNameMatch(n.trim());
                        if (gradeKey === 'secretaire') setActiveView('agenda');
                        sessionStorage.setItem('lgMemberName', n.trim());
                        setIsLogged(true); setFbError(null);
                        return;
                    } catch(e) { /* pas de compte individuel, essai compte grade */ }
                }

                try {
                    await api.signInWithEmailAndPassword(api.auth, GRADE_ACCOUNTS[gradeKey], p.trim());
                } catch (e) {
                    return setFbError("Mot de passe incorrect pour ce grade.");
                }
                setUnlockedGrades(grades);
                setIsArchitect(false);
                setIsTresorier(gradeKey === 'tresorier');
                setLoginGradeKey(gradeKey);
                setMemberName(n.trim());
                setMemberRole(gradeKey === 'vm' ? 'Vénérable Maître' : gradeKey === 'tresorier' ? 'Trésorier' : gradeKey === 'secretaire' ? 'Secrétaire' : '');
                setMemberGenre(genre || 'frere');
                setPendingNameMatch(n.trim());
                sessionStorage.setItem('lgMemberName', n.trim());
                if (gradeKey === 'secretaire') setActiveView('agenda');
                setIsLogged(true); setFbError(null);
            };

            const handleArchitectLogin = async (pwd) => {
                try {
                    await api.signInWithEmailAndPassword(api.auth, ARCHITECT_ACCOUNT, pwd);
                } catch (e) {
                    return setFbError("Accès Architecte refusé.");
                }
                setUnlockedGrades({ apprenti:true, compagnon:true, maitre:true });
                setIsArchitect(true);
                setMemberName('Architecte');
                setMemberRole('Architecte');
                setIsLogged(true); setFbError(null);
            };

            // Une fois les membres chargés (après authentification), on retrouve le nom complet/role pour l'affichage et l'identité de Loge
            useEffect(() => {
                if (!pendingNameMatch || members.length === 0) return;
                const clean = (str) => str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/œ/g, "oe").replace(/v∴m∴|soeur|frere|[^a-z]/g, "");
                const search = clean(pendingNameMatch);
                const m = members.find(x => clean(x.name).includes(search) || search.includes(clean(x.name)));
                if (m) {
                    setMemberName(m.name);
                    setMemberGenre(m.genre || 'frere');
                    const role = m.role || '';
                    setMemberRole(role);
                    const r = role.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
                    const isRoleVM = r.includes('venerable') || r.includes('v.m.') || r.includes('vm');
                    const isRoleArchi = r.includes('architecte');
                    const isRoleTres = r.includes('tresorier') || r.includes('tresorier');
                    const isRoleSec = r.includes('secretaire');
                    if (isRoleVM) setLoginGradeKey('vm');
                    if (isRoleArchi) setIsArchitect(true);
                    if (isRoleTres) setIsTresorier(true);
                    if (isRoleSec) setActiveView('agenda');
                    if (isRoleVM || isRoleArchi) setUnlockedGrades({apprenti:true,compagnon:true,maitre:true});
                }
                setPendingNameMatch('');
            }, [members, pendingNameMatch]);

            const canSee = useCallback((v) => {
                const vis = (v || 'apprenti').toLowerCase().trim();
                if (unlockedGrades.maitre || isArchitect) return true;
                if (unlockedGrades.compagnon && (vis.includes('compagnon') || vis.includes('apprenti'))) return true;
                if (unlockedGrades.apprenti && vis.includes('apprenti')) return true;
                return false;
            }, [unlockedGrades, isArchitect]);

            const handleGradeUnlock = async (pwd) => {
                try {
                    await api.signInWithEmailAndPassword(api.auth, GRADE_ACCOUNTS[pendingGrade], pwd);
                } catch (e) {
                    return false;
                }
                let n = { ...unlockedGrades };
                if (pendingGrade === 'maitre') n = { apprenti: true, compagnon: true, maitre: true };
                else if (pendingGrade === 'compagnon') n = { ...n, apprenti: true, compagnon: true };
                else n.apprenti = true;
                setUnlockedGrades(n); setActiveView(pendingGrade); return true;
            };

            if (!isLogged) return <LoginScreen onLogin={handleLogin} onArchitectLogin={handleArchitectLogin} error={fbError} logo={logeLogo} logeName={logeIdentity.name} />;
            const loader = document.getElementById('loading-screen'); if (loader) loader.style.display = 'none';

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    {fbError && <div className="bg-red-600 text-white text-xs font-bold px-4 py-2 text-center z-50">{fbError} — <button onClick={()=>setFbError(null)} className="underline ml-2">Fermer</button></div>}
                    <nav className="bg-slate-900 text-amber-500 shadow-xl sticky top-0 z-50 p-3 font-sans">
                        <div className="max-w-7xl mx-auto flex justify-between items-center gap-4 text-white">
                            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveView('home')}>
                                {logeLogo ? <img src={logeLogo} className="w-10 h-10 object-contain" /> : <SmartIcon name="Landmark" size={24} className="text-white"/>}
                                <span className="text-lg font-bold font-serif text-white tracking-widest uppercase hidden md:inline">{logeIdentity?.name || 'Ma Loge'}</span>
                            </div>
                            <div className="flex flex-wrap justify-center items-center gap-2 font-serif text-[10px]">
                                <NavTab active={activeView==='home'} onClick={()=>setActiveView('home')} icon="place-of-worship" label="Parvis" />
                                <button onClick={()=>setActiveView('adherents')} className={`flex items-center space-x-1.5 px-3 py-2 rounded-xl text-[10px] font-bold uppercase transition-all font-serif ${activeView==='adherents' ? 'bg-blue-600 text-white shadow-lg' : 'bg-blue-900 text-blue-300 hover:bg-blue-700 hover:text-white'}`}><i className="fa-solid fa-users"></i><span className="hidden sm:inline font-sans">Tableau de Loge</span></button>
                                <NavTab active={activeView==='agenda'} onClick={()=>setActiveView('agenda')} icon="scroll" label="Ordre des Travaux" />
                                <NavTab active={activeView==='bibliotheque'} onClick={()=>setActiveView('bibliotheque')} icon="book-open" label="Les Archives" />
                                <NavTab active={activeView==='liens'} onClick={()=>setActiveView('liens')} icon="hands-holding" label="Chaîne d'Union" />
                                {(isVM || isArchitect || hasTresorAccess) && <NavTab active={activeView==='visite'} onClick={()=>setActiveView('visite')} icon="user-check" label="Visite" />}
                                {hasTresorAccess && <NavTab active={activeView==='tresorerie'} onClick={()=>setActiveView('tresorerie')} icon="scale-balanced" label="Trésorerie" />}
                                {(isVM || isArchitect) && <NavTab active={activeView==='configuration'} onClick={()=>setActiveView('configuration')} icon="compass-drafting" label="Configuration" />}

                                <div className="w-px h-6 bg-slate-700 mx-2 hidden lg:block"></div>
                                <div className="relative font-sans">
                                    <button onClick={() => setShowGradesMenu(!showGradesMenu)} className={`px-3 py-2 rounded-xl text-[10px] font-bold uppercase transition-all font-serif ${['apprenti','compagnon','maitre','read','write'].includes(activeView) ? 'bg-amber-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800'}`}>Planche</button>
                                    {showGradesMenu && (
                                        <div className="absolute top-full mt-2 right-0 w-40 rounded-xl shadow-2xl bg-slate-800 border border-slate-700 z-50 flex flex-col overflow-hidden animate-fade font-serif">
                                            {['apprenti', 'compagnon', 'maitre'].map(g => {
                                                const symbols = {apprenti:'⊾', compagnon:'—', maitre:'∧'};
                                                const clrs = {apprenti:'text-blue-400',compagnon:'text-emerald-400',maitre:'text-amber-400'};
                                                return (
                                                <button key={g} onClick={() => { if(!unlockedGrades[g]) { setPendingGrade(g); setActiveView('grade_auth'); } else setActiveView(g); setShowGradesMenu(false); }} className="flex items-center px-4 py-3 text-slate-300 hover:bg-amber-600 hover:text-white border-b border-slate-700 last:border-0 uppercase font-bold text-[10px] tracking-widest gap-2">
                                                    <span className={`text-base font-bold ${clrs[g]}`}>{symbols[g]}</span>
                                                    <SmartIcon name={unlockedGrades[g] ? "Unlock" : "Lock"} size={12} />
                                                    {g.toUpperCase()}
                                                </button>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                                {isArchitect && (
                                    <button onClick={()=>setShowApiKeyModal(true)} className={`px-3 py-2 rounded-xl text-[10px] font-bold uppercase transition-all font-serif ${claudeApiKey ? 'text-blue-400 hover:bg-slate-800' : 'text-red-400 hover:bg-slate-800'}`} title="Clé API Intelligence Artificielle">
                                        IA {claudeApiKey ? '✓' : '✗'}
                                    </button>
                                )}
                                <button onClick={() => { api.signOut(api.auth); setIsLogged(false); setIsArchitect(false); setUnlockedGrades({apprenti:false,compagnon:false,maitre:false}); setMemberName(''); setMemberRole(''); setMemberGenre('frere'); setActiveView('home'); }} className="p-2 text-slate-400 hover:text-red-500 transition-colors font-sans"><SmartIcon name="LogOut" size={20}/></button>
                            </div>
                        </div>
                    </nav>
                    {showApiKeyModal && (
                        <div className="fixed inset-0 bg-slate-900/90 z-[200] flex items-center justify-center p-4 animate-fade">
                            <div className="bg-white rounded-[2rem] p-8 max-w-md w-full shadow-2xl">
                                <h2 className="text-xl font-serif font-bold mb-2">Clé API Intelligence Artificielle</h2>
                                <p className="text-slate-500 text-sm mb-6">Permet l'analyse automatique des ODJ (grade, planche, auteur). Clé gratuite sur <strong>aistudio.google.com/app/apikey</strong>.</p>
                                <input type="password" value={apiKeyInput} onChange={e=>{setApiKeyInput(e.target.value);setKeyError('');}} placeholder="AIza..." className="w-full border-2 p-3 rounded-xl text-sm outline-none focus:border-amber-500 font-mono mb-4" />
                                {keyError && <p className="text-red-500 text-xs font-bold mb-3">{keyError}</p>}
                                <div className="flex gap-3">
                                    <button onClick={()=>{setShowApiKeyModal(false);setKeyError('');}} className="flex-1 text-slate-400 font-bold text-xs uppercase py-3 border rounded-xl">Annuler</button>
                                    {claudeApiKey && <ConfirmButton onConfirm={async()=>{ await api.setDoc(api.doc(api.db,'artifacts',api.appId,'public','data','settings','claudeapi'),{key:''}); setShowApiKeyModal(false); }} className="text-red-400 font-bold text-xs uppercase py-3 px-4 border border-red-200 rounded-xl" label="Supprimer" />}
                                    <button disabled={savingKey||!apiKeyInput.trim()} onClick={async()=>{ setSavingKey(true); setKeyError(''); try { await api.setDoc(api.doc(api.db,'artifacts',api.appId,'public','data','settings','claudeapi'),{key:apiKeyInput.trim()}); setShowApiKeyModal(false); setKeyError(''); } catch(err){ const email = api.auth?.currentUser?.email||'?'; setKeyError('Erreur : '+(err?.message||err?.code||'permission refusée')+' (compte : '+email+')'); } finally { setSavingKey(false); } }} className={`flex-1 text-white font-bold text-xs uppercase py-3 rounded-xl shadow-md transition-all ${savingKey||!apiKeyInput.trim()?'bg-slate-400 cursor-not-allowed':'bg-amber-600 hover:bg-amber-700'}`}>{savingKey?'Enregistrement...':'Enregistrer'}</button>
                                </div>
                            </div>
                        </div>
                    )}
                    <main className="max-w-7xl mx-auto px-4 py-8 flex-grow w-full font-sans">
                        {activeView === 'home' && <HomeView planchesCount={planches.length} logo={logeLogo} agendaItems={agendaItems} canSee={canSee} memberName={memberName} memberGenre={memberGenre} onSaveLogo={async(file)=>{ const url = await api.uploadFile(file, `${LOGE_APP_ID}/branding`); await api.setDoc(api.doc(api.db,'artifacts',api.appId,'public','data','settings','branding'), {logoData:url}, {merge:true}); }} canEdit={canEdit} isArchitect={isArchitect} unlockedGrades={unlockedGrades} onUpdateAgenda={async(id,d)=>await api.updateDoc(api.doc(api.db,'artifacts',api.appId,'public','data','agenda',id),d)} logeIdentity={logeIdentity} onSaveIdentity={async(idData)=>await api.setDoc(api.doc(api.db,'artifacts',api.appId,'public','data','settings','identity'), idData, {merge:true})} isVM={isVM} welcomeText={welcomeText} onSaveWelcome={async(txt)=>await api.setDoc(api.doc(api.db,'artifacts',api.appId,'public','data','settings','welcome'), {text:txt}, {merge:true})} planches={planches} onReadPlanche={p=>{setSelectedPlanche(p);setActiveView('read');}} />}
                        {activeView === 'adherents' && <AdherentsView members={members} onAdd={async(m)=>await api.addDoc(api.collection(api.db,'artifacts',api.appId,'public','data','members'),m)} onUpdate={async(id,d)=>await api.updateDoc(api.doc(api.db,'artifacts',api.appId,'public','data','members',id),d)} onDelete={async(id)=>await api.deleteDoc(api.doc(api.db,'artifacts',api.appId,'public','data','members',id))} canEdit={canEdit} />}
                        {activeView === 'bibliotheque' && <BibliothequeView books={books} onAdd={async(b)=>await api.addDoc(api.collection(api.db,'artifacts',api.appId,'public','data','bibliotheque'),{...b,sharedBy:memberName})} onUpdate={async(id,d)=>await api.updateDoc(api.doc(api.db,'artifacts',api.appId,'public','data','bibliotheque',id),d)} onDelete={async(id)=>await api.deleteDoc(api.doc(api.db,'artifacts',api.appId,'public','data','bibliotheque',id))} unlockedGrades={unlockedGrades} currentUser={memberName} reglementFile={reglementFile} onSaveReglement={async(f)=>await api.setDoc(api.doc(api.db,'artifacts',api.appId,'public','data','settings','reglement'), f)} isArchitect={isArchitect} isVM={isVM} />}
                        {activeView === 'liens' && <LiensUtilesView liens={liens} canEdit={isVM || isArchitect} onAdd={async(l)=>await api.addDoc(api.collection(api.db,'artifacts',api.appId,'public','data','liens'),l)} onUpdate={async(id,d)=>await api.updateDoc(api.doc(api.db,'artifacts',api.appId,'public','data','liens',id),d)} onDelete={async(id)=>await api.deleteDoc(api.doc(api.db,'artifacts',api.appId,'public','data','liens',id))} />}
                        {activeView === 'tresorerie' && hasTresorAccess && (
                            <div style={{height:'calc(100vh - 80px)', width:'100%'}}>
                                <iframe src="/tresor.html" style={{width:'100%', height:'100%', border:'none'}} title="Trésorerie" />
                            </div>
                        )}
                        {activeView === 'configuration' && (isArchitect || isVM) && <ConfigurationView api={api} logeIdentity={logeIdentity} onSaveIdentity={async(idData)=>await api.setDoc(api.doc(api.db,'artifacts',api.appId,'public','data','settings','identity'), idData, {merge:true})} logeLogo={logeLogo} onSaveLogo={async(file)=>{ const url = await api.uploadFile(file, `${LOGE_APP_ID}/branding`); await api.setDoc(api.doc(api.db,'artifacts',api.appId,'public','data','settings','branding'), {logoData:url}, {merge:true}); }} />}
                        {activeView === 'agenda' && <AgendaView items={agendaItems} canEdit={canEditAgenda} onAdd={(t)=>api.addDoc(api.collection(api.db, 'artifacts', api.appId, 'public', 'data', 'agenda'), t)} onUpdate={async(id,d)=>await api.updateDoc(api.doc(api.db,'artifacts',api.appId,'public','data','agenda',id),d)} onDelete={(id)=>api.deleteDoc(api.doc(api.db, 'artifacts', api.appId, 'public', 'data', 'agenda', id))} canSee={canSee} apiKey={claudeApiKey} />}
                        {activeView === 'visite' && <VisiteView items={agendaItems} canEdit={canEdit} onUpdate={async(id,d)=>await api.updateDoc(api.doc(api.db,'artifacts',api.appId,'public','data','agenda',id),d)} apiKey={claudeApiKey} />}
                        {activeView === 'grade_auth' && <GradeAuthScreen grade={pendingGrade} onCancel={()=>setActiveView('home')} onValidate={handleGradeUnlock} logo={logeLogo} />}
                        {['apprenti','compagnon','maitre'].includes(activeView) && (() => {
                            // Planches from the planches collection
                            const standalonePlanches = planches.filter(p=>normalizeGrade(p.grade)===activeView);
                            // Planches embedded in tenues (agenda items)
                            const tenuePlanches = agendaItems.flatMap(t => (t.planches||[]).map(p=>({
                                ...p,
                                fromTenue: true,
                                tenueId: t.id,
                                tenueDate: t.date,
                                id: `tenue_${t.id}_${(p.title||'').replace(/\s/g,'_')}`
                            }))).filter(p => normalizeGrade(p.grade)===activeView);
                            const allPlanches = [...standalonePlanches, ...tenuePlanches];
                            return <PlanchesView activeGrade={activeView} planches={allPlanches} onRead={p=>{setSelectedPlanche(p);setActiveView('read');}} onWrite={()=>setActiveView('write')} loginGradeKey={loginGradeKey} isArchitect={isArchitect} isVM={isVM} />;
                        })()}
                        {activeView === 'read' && <ReadPlancheView planche={selectedPlanche} onBack={()=>setActiveView(normalizeGrade(selectedPlanche.grade))} onDelete={async(id)=>{await api.deleteDoc(api.doc(api.db,'artifacts',api.appId,'public','data','planches',id)); setActiveView(normalizeGrade(selectedPlanche.grade));}} currentUser={memberName} isArchitect={isArchitect} isVM={isVM} loginGradeKey={loginGradeKey} />}
                        {activeView === 'write' && <WritePlancheView onBack={()=>setActiveView(loginGradeKey||'home')} onSubmit={async(p)=>{await api.addDoc(api.collection(api.db,'artifacts',api.appId,'public','data','planches'),{...p,submittedBy:memberName}); setActiveView(normalizeGrade(p.grade));}} defaultGrade={loginGradeKey||'apprenti'} currentUser={memberName} isArchitect={isArchitect} />}
                    </main>
                    <footer className="py-8 text-center text-slate-400 text-[10px] uppercase font-bold tracking-[0.2em] border-t bg-white font-serif">{logeIdentity?.name || 'Ma Loge'}{logeIdentity?.orient ? ` — Orient de ${logeIdentity.orient}` : ''}</footer>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        if (rootElement && !rootElement._reactRoot) {
            const root = ReactDOM.createRoot(rootElement);
            rootElement._reactRoot = root;
            root.render(<App />);
        }
    </script>

    <!-- Enregistrement Service Worker (PWA) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('✅ SW enregistré:', reg.scope))
                    .catch(err => console.warn('SW non enregistré:', err));
            });
        }
    </script>
</body>
</html>
