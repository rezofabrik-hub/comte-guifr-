services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fraternapp}
      MYSQL_USER: ${MYSQL_USER:-fraternapp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fraternapp}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      target: dev
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-fraternapp}:${MYSQL_PASSWORD:-fraternapp}@db:3306/${MYSQL_DATABASE:-fraternapp}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO:-rezofabrik-hub/comte-guifr-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      PORT: 4000
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      target: dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:4000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  mysql_data:
